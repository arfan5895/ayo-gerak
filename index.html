<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayo Gerak — Ruang belajar PJOK SD kelas 1–6</title>
<style>
  :root{
    --lapangan:#0F4C42;
    --lapangan-tua:#0A322C;
    --kapur:#F3F6EF;
    --tenis:#D9EA4C;
    --lintasan:#E2542B;
    --abu:#5E6D68;
    --garis:rgba(15,76,66,.14);
    --display:"Arial Black","Arial Bold",Gadget,system-ui,sans-serif;
    --teks:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --aksen:var(--tenis);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--kapur);color:var(--lapangan-tua);font-family:var(--teks);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .bungkus{max-width:860px;margin:0 auto;padding:0 18px 96px}

  header.lapangan{
    background:var(--lapangan);
    background-image:repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.06) 39px 40px);
    color:#fff;padding:22px 0 18px;border-bottom:5px solid var(--aksen);transition:border-color .2s ease;
  }
  .kepala-isi{max-width:860px;margin:0 auto;padding:0 18px}
  .logo{display:flex;align-items:center;gap:11px}
  .peluit{width:34px;height:34px;border-radius:50%;background:var(--aksen);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--lapangan-tua);flex:none;transition:background .2s ease}
  .logo h1{font-family:var(--display);font-size:clamp(23px,6.4vw,31px);letter-spacing:-.03em;text-transform:uppercase;margin:0;line-height:1}
  .logo p{margin:3px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .peran{display:flex;gap:6px;margin-top:18px;background:rgba(0,0,0,.26);padding:5px;border-radius:999px}
  .peran button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.8);font-family:var(--teks);font-size:14px;font-weight:650;padding:9px 6px;border-radius:999px;cursor:pointer;transition:background .18s ease,color .18s ease}
  .peran button[aria-pressed="true"]{background:var(--aksen);color:var(--lapangan-tua)}
  .peran button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  body.mode-guru{--aksen:var(--lintasan)}

  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--abu);font-weight:700;margin:26px 0 10px}
  h2{font-family:var(--display);font-size:20px;letter-spacing:-.02em;margin:0 0 4px;text-transform:uppercase}
  h3{font-size:15.5px;margin:22px 0 8px;letter-spacing:-.01em}
  p{margin:0 0 10px}
  .catatan{color:var(--abu);font-size:14px}

  .cari{width:100%;padding:12px 14px;border:2px solid var(--garis);border-radius:12px;font-family:var(--teks);font-size:15px;background:#fff;margin-bottom:4px}
  .cari:focus{outline:2px solid var(--lapangan);outline-offset:1px}

  .kelas-baris{display:flex;gap:9px;flex-wrap:wrap}
  .nomor{width:56px;height:64px;border:2px solid var(--garis);background:#fff;border-radius:12px;cursor:pointer;font-family:var(--display);font-size:24px;color:var(--lapangan);display:grid;place-items:center;line-height:1;transition:transform .15s ease,border-color .15s ease,background .15s ease}
  .nomor small{display:block;font-family:var(--teks);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--abu);margin-top:4px}
  .nomor:hover{transform:translateY(-2px);border-color:var(--lapangan)}
  .nomor[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan)}
  .nomor[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
  .nomor:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}

  .fase{margin-top:14px;padding:12px 14px;background:#fff;border-radius:var(--radius);border-left:5px solid var(--aksen);font-size:14px}
  .fase b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--abu);margin-bottom:3px}

  .progres{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-top:14px}
  .progres .baris{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .progres b{font-family:var(--display);font-size:17px}
  .bar{height:9px;background:var(--garis);border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--aksen);border-radius:99px;transition:width .4s ease}

  .kartu{width:100%;text-align:left;border:0;background:#fff;cursor:pointer;border-radius:var(--radius);padding:15px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 0 var(--garis);transition:transform .15s ease,box-shadow .15s ease;font-family:var(--teks)}
  .kartu:hover{transform:translateX(3px);box-shadow:0 3px 14px rgba(15,76,66,.12)}
  .kartu:focus-visible{outline:2px solid var(--lapangan);outline-offset:2px}
  .jalur{width:6px;align-self:stretch;border-radius:99px;background:var(--aksen);flex:none}
  .kartu-teks{flex:1;min-width:0}
  .kartu .el{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--abu);font-weight:700}
  .kartu .jd{font-weight:700;font-size:16px;letter-spacing:-.01em;margin-top:2px}
  .lencana{font-size:11px;font-weight:700;color:var(--lapangan);background:#E7F5E1;border-radius:99px;padding:3px 9px;flex:none}
  .panah{font-size:19px;color:var(--lapangan);flex:none}

  .tab{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .tab button{border:2px solid var(--garis);background:#fff;color:var(--lapangan-tua);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:var(--teks);font-size:13.5px;font-weight:650}
  .tab button[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan)}
  .tab button:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}

  .panel{background:#fff;border-radius:var(--radius);padding:17px 17px 19px;animation:masuk .18s ease}
  @keyframes masuk{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  ul.rapi{margin:0;padding-left:19px}
  ul.rapi li{margin-bottom:7px}
  ol.langkah{list-style:none;counter-reset:l;margin:0;padding:0}
  ol.langkah li{counter-increment:l;position:relative;padding-left:40px;margin-bottom:13px}
  ol.langkah li::before{content:counter(l);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:var(--lapangan);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:13px}
  .main{border:2px dashed var(--garis);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .main b{display:block;margin-bottom:3px}

  /* ---------- panggung animasi ---------- */
  .panggung{
    background:#0F4C42;
    background-image:repeating-linear-gradient(90deg,transparent 0 29px,rgba(255,255,255,.07) 29px 30px);
    border-radius:var(--radius);padding:8px 8px 0;overflow:hidden;position:relative;
  }
  .panggung svg{display:block;width:100%;height:auto;max-height:250px}
  .keterangan{background:rgba(0,0,0,.28);color:#fff;font-size:13.5px;padding:9px 12px;margin:0 -8px;line-height:1.45}
  .kendali{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
  .kendali button{border:2px solid var(--garis);background:#fff;color:var(--lapangan-tua);font-family:var(--teks);font-weight:650;font-size:13.5px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .kendali button[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan)}
  .kendali button:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}
  .kendali .unggah{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--lapangan);background:#fff;color:var(--lapangan);font-family:var(--teks);font-weight:650;font-size:13.5px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .kendali .unggah input{display:none}
  .kendali .unggah:focus-within{outline:2px solid var(--lintasan);outline-offset:2px}
  .panggung img.foto{display:block;width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.2)}
  .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini button{border:2px solid var(--garis);background:#fff;border-radius:10px;padding:0;overflow:hidden;width:64px;height:52px;cursor:pointer}
  .mini button[aria-pressed="true"]{border-color:var(--lapangan)}
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .mini:focus-visible{outline:2px solid var(--lapangan)}
  .baris-soal{display:flex;justify-content:space-between;align-items:center}
  .sapa{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:var(--radius);padding:11px 14px;margin-top:18px;font-size:14.5px}
  .sapa button{border:2px solid var(--garis);background:#fff;color:var(--lapangan);font-family:var(--teks);font-weight:650;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;flex:none}
  .daftar-akun{margin-bottom:6px}
  .daftar-akun .kartu{margin-bottom:8px}
  .kunci input#namabaru,.kunci input#tautansiswa{letter-spacing:normal;text-align:left;font-size:15px}
  .isian input[readonly]{background:var(--kapur);font-size:13.5px}
  .bingkai{position:relative;width:100%;padding-top:56.25%;margin-top:10px;border-radius:10px;overflow:hidden;background:#000}
  .bingkai iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  video.video{width:100%;max-height:300px;border-radius:10px;background:#000;margin-top:10px;display:block}
  .kunci{max-width:360px;margin:26px auto 0;background:#fff;border-radius:var(--radius);padding:22px}
  .kunci h2{margin-bottom:8px}
  .kunci input{width:100%;padding:12px 14px;border:2px solid var(--garis);border-radius:11px;font-family:var(--teks);font-size:19px;letter-spacing:.3em;text-align:center;margin-bottom:10px;background:#fff}
  .kunci input:focus{outline:2px solid var(--lapangan);outline-offset:1px}
  .kunci .tombol{width:100%}
  .kunci .pesan{color:var(--lintasan);font-size:14px;min-height:20px;margin:8px 0 0}

  .figur line,.figur circle,.gulung line,.gulung circle{stroke:#fff;stroke-width:7;stroke-linecap:round;fill:none}
  .figur .kepala,.gulung .kepala{fill:var(--tenis);stroke:var(--tenis)}
  .bola{fill:var(--lintasan)}
  .alat{stroke:var(--tenis);stroke-width:7;stroke-linecap:round}
  .tanah{stroke:rgba(255,255,255,.45);stroke-width:3;stroke-dasharray:10 8}
  .gelembung{fill:rgba(217,234,76,.75)}
  .lgn{transform-box:view-box;transform-origin:100px 78px}
  .kk{transform-box:view-box;transform-origin:100px 115px}
  .figur,.gulung,.bola,.alat,.gelembung{transform-box:view-box}
  .figur{transform-origin:100px 160px}
  .gulung{transform-origin:100px 130px}

  @keyframes ayunA{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
  @keyframes ayunB{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
  @keyframes ayunKecilA{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
  @keyframes ayunKecilB{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  @keyframes putarPenuh{to{transform:rotate(360deg)}}
  @keyframes lompatFigur{0%,100%{transform:translateY(0)}18%{transform:translateY(10px)}45%{transform:translateY(-52px)}72%{transform:translateY(6px)}}
  @keyframes lenganAngkat{0%,100%{transform:rotate(20deg)}45%{transform:rotate(-115deg)}}
  @keyframes goyang{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes geserSamping{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
  @keyframes lenganNaik{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-70deg)}}
  @keyframes tendangKaki{0%,55%,100%{transform:rotate(0)}30%{transform:rotate(-60deg)}}
  @keyframes bolaTendang{0%,30%{transform:translate(0,0);opacity:1}75%{transform:translate(105px,-34px);opacity:1}90%,100%{transform:translate(120px,-10px);opacity:0}}
  @keyframes lemparLengan{0%{transform:rotate(150deg)}35%{transform:rotate(140deg)}60%{transform:rotate(-35deg)}100%{transform:rotate(150deg)}}
  @keyframes bolaLempar{0%,45%{transform:translate(0,0);opacity:1}80%{transform:translate(96px,-46px);opacity:1}95%,100%{transform:translate(120px,4px);opacity:0}}
  @keyframes squat{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
  @keyframes gulingMaju{0%{transform:translateX(-62px) rotate(0)}100%{transform:translateX(62px) rotate(360deg)}}
  @keyframes gulingMundur{0%{transform:translateX(62px) rotate(0)}100%{transform:translateX(-62px) rotate(-360deg)}}
  @keyframes bolaPantul{0%,100%{transform:translateY(0)}50%{transform:translateY(-58px)}}
  @keyframes bolaDribel{0%,100%{transform:translateY(-52px)}50%{transform:translateY(0)}}
  @keyframes pompaLengan{0%,100%{transform:rotate(28deg)}50%{transform:rotate(58deg)}}
  @keyframes ayunPemukul{0%,60%,100%{transform:rotate(-55deg)}80%{transform:rotate(70deg)}}
  @keyframes bolaPukul{0%,78%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(-120px,-40px);opacity:0}}
  @keyframes gosokKi{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(8deg)}}
  @keyframes gosokKa{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-8deg)}}
  @keyframes naikHilang{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-52px);opacity:0}}
  @keyframes larikanan{from{transform:translateX(-70px)}to{transform:translateX(20px)}}
  @keyframes tongkatPindah{0%,40%{transform:translate(-52px,0)}70%,100%{transform:translate(34px,0)}}

  svg.gerak{--spd:1}
  svg.gerak.lambat{--spd:2.1}
  svg.gerak.jeda *{animation-play-state:paused!important}

  .a-lari .lgn-ka,.a-lari .kk-ki{animation:ayunA calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-lari .lgn-ki,.a-lari .kk-ka{animation:ayunB calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-lari .figur{animation:bob calc(var(--spd)*.21s) infinite alternate ease-in-out}
  .a-jalan .lgn-ka,.a-jalan .kk-ki{animation:ayunKecilA calc(var(--spd)*.8s) infinite alternate ease-in-out}
  .a-jalan .lgn-ki,.a-jalan .kk-ka{animation:ayunKecilB calc(var(--spd)*.8s) infinite alternate ease-in-out}
  .a-putar .lgn-ki,.a-putar .lgn-ka{animation:putarPenuh calc(var(--spd)*1.7s) linear infinite}
  .a-lompat .figur{animation:lompatFigur calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-lompat .lgn-ki,.a-lompat .lgn-ka{animation:lenganAngkat calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-imbang .kk-ka{transform:rotate(38deg)}
  .a-imbang .lgn-ki{transform:rotate(-72deg)}
  .a-imbang .lgn-ka{transform:rotate(72deg)}
  .a-imbang .figur{animation:goyang calc(var(--spd)*2.4s) infinite ease-in-out}
  .a-ritmik .figur{animation:geserSamping calc(var(--spd)*1.1s) infinite alternate ease-in-out}
  .a-ritmik .lgn-ki{animation:lenganNaik calc(var(--spd)*1.1s) infinite ease-in-out}
  .a-ritmik .lgn-ka{animation:lenganNaik calc(var(--spd)*1.1s) infinite ease-in-out reverse}
  .a-tendang .kk-ka{animation:tendangKaki calc(var(--spd)*1.7s) infinite ease-in-out}
  .a-tendang .bola{animation:bolaTendang calc(var(--spd)*1.7s) infinite ease-out}
  .a-tendang .lgn-ki{transform:rotate(-24deg)}
  .a-lempar .lgn-ka{animation:lemparLengan calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-lempar .bola{animation:bolaLempar calc(var(--spd)*1.9s) infinite ease-out}
  .a-kuat .figur{animation:squat calc(var(--spd)*1.6s) infinite ease-in-out}
  .a-kuat .lgn-ki{transform:rotate(-84deg)}
  .a-kuat .lgn-ka{transform:rotate(84deg)}
  .a-guling .gulung{animation:gulingMaju calc(var(--spd)*2.2s) infinite linear}
  .a-guling-mundur .gulung{animation:gulingMundur calc(var(--spd)*2.2s) infinite linear}
  .a-passing .figur{animation:squat calc(var(--spd)*1.5s) infinite ease-in-out}
  .a-passing .lgn-ki{transform:rotate(-44deg)}
  .a-passing .lgn-ka{transform:rotate(44deg)}
  .a-passing .bola{animation:bolaPantul calc(var(--spd)*1.5s) infinite ease-in-out}
  .a-dribel .bola{animation:bolaDribel calc(var(--spd)*.72s) infinite ease-in-out}
  .a-dribel .lgn-ka{animation:pompaLengan calc(var(--spd)*.72s) infinite ease-in-out}
  .a-pukul .alat-pukul{animation:ayunPemukul calc(var(--spd)*2s) infinite ease-in-out}
  .a-pukul .bola{animation:bolaPukul calc(var(--spd)*2s) infinite ease-out}
  .a-pukul .lgn-ki,.a-pukul .lgn-ka{transform:rotate(-40deg)}
  .a-sehat .lgn-ki{animation:gosokKi calc(var(--spd)*.6s) infinite ease-in-out;transform-origin:100px 78px}
  .a-sehat .lgn-ka{animation:gosokKa calc(var(--spd)*.6s) infinite ease-in-out;transform-origin:100px 78px}
  .a-sehat .gelembung{animation:naikHilang calc(var(--spd)*2s) infinite ease-out}
  .a-sehat .g2{animation-delay:.6s}
  .a-sehat .g3{animation-delay:1.2s}
  .a-estafet .lgn-ka,.a-estafet .kk-ki{animation:ayunA calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-estafet .lgn-ki,.a-estafet .kk-ka{animation:ayunB calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-estafet .tongkat{animation:tongkatPindah calc(var(--spd)*2.6s) infinite ease-in-out}

  .soal{margin-bottom:22px}
  .soal .no{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--abu);font-weight:700}
  .soal .tanya{font-weight:650;margin:4px 0 10px}
  .pilihan{display:block;width:100%;text-align:left;margin-bottom:8px;border:2px solid var(--garis);background:#fff;border-radius:11px;padding:11px 13px;cursor:pointer;font-family:var(--teks);font-size:15px;color:var(--lapangan-tua)}
  .pilihan:hover:not(:disabled){border-color:var(--lapangan)}
  .pilihan:disabled{cursor:default}
  .pilihan.benar{background:#E7F5E1;border-color:#3F8F42;font-weight:650}
  .pilihan.dipilih{background:var(--lapangan);color:#fff;border-color:var(--lapangan);font-weight:650}
  .pilihan.salah{background:#FDECE7;border-color:var(--lintasan)}
  .pilihan:focus-visible{outline:2px solid var(--lapangan);outline-offset:2px}
  .bahas{font-size:14px;background:var(--kapur);border-radius:10px;padding:10px 12px;margin-top:2px}
  .skor{background:var(--lapangan);color:#fff;border-radius:var(--radius);padding:16px;text-align:center;margin-top:6px}
  .skor .angka{font-family:var(--display);font-size:38px;line-height:1}
  .skor p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:14px}

  .isian{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .isian input,.isian select{flex:1;min-width:150px;padding:11px 13px;border:2px solid var(--garis);border-radius:11px;font-family:var(--teks);font-size:15px;background:#fff}
  .isian input:focus,.isian select:focus{outline:2px solid var(--lapangan);outline-offset:1px}
  textarea{width:100%;min-height:96px;padding:11px 13px;border:2px solid var(--garis);border-radius:11px;font-family:var(--teks);font-size:15px;background:#fff;resize:vertical}
  textarea:focus{outline:2px solid var(--lapangan);outline-offset:1px}
  .tombol{border:0;background:var(--lapangan);color:#fff;font-family:var(--teks);font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:11px;cursor:pointer}
  .tombol.garis{background:#fff;color:var(--lapangan);border:2px solid var(--lapangan)}
  .tombol:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}
  .gulir{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -17px;padding:0 17px}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:430px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--garis);text-align:left}
  th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--abu);font-weight:700;vertical-align:bottom}
  td select{padding:6px;border:2px solid var(--garis);border-radius:8px;font-family:var(--teks);font-size:14px;background:#fff}
  td.nilai{font-family:var(--display);font-size:16px}
  .hapus{border:0;background:none;color:var(--lintasan);cursor:pointer;font-size:17px;padding:2px 6px}
  .kosong{text-align:center;color:var(--abu);padding:22px 10px;font-size:14px}

  .balik{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--lapangan);font-family:var(--teks);font-weight:700;font-size:14px;cursor:pointer;padding:16px 0 6px}

  footer{border-top:1px solid var(--garis);margin-top:34px;padding-top:16px;font-size:12.5px;color:var(--abu)}
  @media (prefers-reduced-motion:reduce){

  }

function bukaDB(){
  return new Promise((ok,gagal)=>{
    if(!window.indexedDB) return gagal();
    const r = indexedDB.open("ayogerak",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("data");
    r.onsuccess = ()=> ok(r.result);
    r.onerror = ()=> gagal(r.error);
  });
}
function bungkusData(){ return {gambar:S.gambar, video:S.video, sunting:S.sunting, regu:S.regunama, preset:S.preset, akun:S.akun, server:S.server, antrian:S.antrian, perangkat:S.perangkat, pilihanNilai:S.pilihanNilai,
           namaApp:S.namaApp, subApp:S.subApp, kodeKelas:S.kodeKelas, kodeGuru:S.kodeGuru}; }
function bukaData(d){
  if(!d) return;
  if(d.gambar) S.gambar = {...S.gambar, ...d.gambar};
  if(d.video) S.video = {...S.video, ...d.video};
  if(d.sunting) S.sunting = {...S.sunting, ...d.sunting};
  if(d.regu) S.regunama = d.regu;
  if(d.preset) S.preset = d.preset;
  if(d.akun) S.akun = d.akun;
  if(d.server) S.server = d.server;
  if(d.antrian) S.antrian = d.antrian;
  if(d.perangkat) S.perangkat = d.perangkat;
  if(d.pilihanNilai) S.pilihanNilai = d.pilihanNilai;
  if(d.namaApp) S.namaApp = d.namaApp;
  if(d.subApp) S.subApp = d.subApp;
  if(d.kodeKelas && !S.kodeUndangan) S.kodeKelas = d.kodeKelas;
  if(d.kodeGuru && !S.kodeUndangan) S.kodeGuru = d.kodeGuru;
}
async function simpanData(){
  const isi = bungkusData();
  try{
    const db = await bukaDB();
    await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readwrite");
      t.objectStore("data").put(isi,"aplikasi");
      t.oncomplete = ok; t.onerror = ()=>gagal(t.error);
    });
    CARA_SIMPAN = "perangkat"; return true;
  }catch(e){
    try{ localStorage.setItem("ayogerak.data", JSON.stringify(isi)); CARA_SIMPAN="perangkat"; return true; }
    catch(e2){ CARA_SIMPAN="memori"; return false; }
  }
}
async function muatData(){
  if(BAWAAN) bukaData(BAWAAN);
  try{
    const db = await bukaDB();
    const data = await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readonly");
      const q = t.objectStore("data").get("aplikasi");
      q.onsuccess = ()=> ok(q.result); q.onerror = ()=> gagal(q.error);
    });
    bukaData(data); CARA_SIMPAN = "perangkat"; return;
  }catch(e){}
  try{
    const teks = localStorage.getItem("ayogerak.data");
    if(teks) bukaData(JSON.parse(teks));
    CARA_SIMPAN = "perangkat";
  }catch(e2){ CARA_SIMPAN = "memori"; }
}
function kecilkan(berkas){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maks = 1200; let w = img.width, h = img.height;
        if(w>maks){ h = Math.round(h*maks/w); w = maks; }
        if(h>maks){ w = Math.round(w*maks/h); h = maks; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ ok(c.toDataURL("image/jpeg",0.78)); }catch(e){ ok(r.result); }
      };
      img.onerror = ()=> ok(r.result);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}

async function kirimSatu(d){
  if(!S.server) return false;
  try{
    const r = await fetch(S.server, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                                     body: JSON.stringify(d)});
    if(r.ok) return true;
  }catch(e){}
  try{
    await fetch(S.server, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
                           body: JSON.stringify(d)});

}
async function kirimAntrian(){
  if(!S.server || !S.antrian.length) return;
  const sisa = [];
  for(const d of S.antrian){ if(!(await kirimSatu(d))) sisa.push(d); }
  const berubah = sisa.length !== S.antrian.length;
  S.antrian = sisa;
  if(berubah) await simpanData();

async function ambilHasilServer(){
  if(!S.server) return {ok:false, pesan:"Alamat server belum diisi."};
  if(!S.kodeKelas || !S.kodeGuru) return {ok:false, pesan:"Kode kelas dan kode guru belum lengkap."};
  try{
    const r = await fetch(S.server + (S.server.includes("?")?"&":"?") + "aksi=daftar" +
                          "&kode=" + encodeURIComponent(S.kodeKelas) +
                          "&guru=" + encodeURIComponent(S.kodeGuru));
    const j = await r.json();
    if(j && j.ok === false) return {ok:false, pesan: j.pesan || "Kode guru ditolak server."};
    if(!j || !j.hasil) return {ok:false, pesan:"Balasan server tidak dikenali."};
    S.hasilServer = j.hasil;
    return {ok:true, jumlah:j.hasil.length};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server. Periksa alamat dan koneksi internet."}; }
}

const KODE_APPS_SCRIPT = `function lembar(nama){

  var sh = lembar('Kode');

    return jawab({ok: cekGuru(p.kode, p.guru)});
  }

  if(p.aksi === 'daftar'){
    if(!cekGuru(p.kode, p.guru)) return jawab({ok:false, pesan:'Kode guru salah.'});
    var sh = lembar('Nilai');
    var hasil = [];
    if(sh.getLastRow() > 1){
      var data = sh.getRange(2, 1, sh.getLastRow()-1, 10).getValues();
      for(var i = 0; i < data.length; i++){
        if(String(data[i][1]) !== String(p.kode)) continue;
        hasil.push({
          waktu: String(data[i][0]).slice(0,24), kodeKelas: data[i][1],
          nama: data[i][2], kelas: data[i][3],
          materi: data[i][4], kelasMateri: data[i][5],
          benar: data[i][6], total: data[i][7], nilai: data[i][8], perangkat: data[i][9]
        });
      }
    }
    return jawab({ok:true, hasil:hasil});
  }

  return jawab({ok:true, pesan:'Server nilai Ayo Gerak siap.'});
}`;

function idAkun(){ return "s" + Date.now().toString(36) + Math.floor(Math.random()*999).toString(36); }
function nilaiDari(v){ return typeof v==="number" ? v : (v && v.n) || 0; }
function akunAktif(){ return S.siswaAktif ? S.akun[S.siswaAktif] : null; }
function progresAktif(){ const a = akunAktif(); return a ? (a.progres = a.progres||{}) : S.progres; }
function buatKodeKelas(){
  const huruf = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let k = "";
  for(let i=0;i<6;i++) k += huruf[Math.floor(Math.random()*huruf.length)];
  return k;
}
function tautanSiswa(){
  const dasar = location.href.split("#")[0].split("?")[0];
  return dasar + "#siswa" + (S.kodeKelas ? "="+S.kodeKelas : "");
}

/* ---------- nilai siswa per kelas, dibuka dengan kode guru ---------- */
function panelNilaiKelas(){
  let h = `<div class="progres" style="margin-top:14px">
    <div class="baris"><span class="catatan">Nilai siswa kelas ${S.kelas}</span></div>`;
  if(!S.server){
    h += `<p class="catatan" style="margin:0">Alamat server belum diisi, jadi nilai siswa dari rumah belum bisa ditampilkan. Isi di tab Alat Bantu.</p></div>`;
    return h;
  }
  if(!S.kodeKelas){
    h += `<p class="catatan" style="margin:0">Buat kode kelas lebih dulu di bagian atas halaman ini.</p></div>`;
    return h;
  }
  if(!S.bukaNilai){
    h += `<p class="catatan" style="margin:0 0 10px">Masukkan kode guru untuk membuka nilai siswa. Ini menjaga agar siswa tidak bisa melihat nilai temannya.</p>
      <div class="isian"><input id="kodebuka" type="password" placeholder="Kode guru" autocomplete="off" maxlength="12">
        <button class="tombol" id="bukanilai">Buka nilai</button></div>
      <p class="catatan" id="pesanbuka" style="margin:8px 0 0"></p></div>`;
    return h;
  }
  const data = (S.hasilServer||[]).filter(x=>String(x.kelas)===String(S.kelas));
  const peta = {};
  data.forEach(x=>{
    const k = String(x.nama).trim().toLowerCase();
    (peta[k] = peta[k] || {nama:String(x.nama).trim(), materi:{}}).materi[x.materi] =
      Math.max(peta[k].materi[x.materi]||0, Number(x.nilai)||0);
  });
  const siswa = Object.values(peta).sort((a,b)=>a.nama.localeCompare(b.nama));
  h += `<div class="kendali" style="margin-top:0"><button id="muatnilai">Muat ulang</button>
        <button id="tutupnilai">Tutup nilai</button></div>`;
  if(siswa.length===0){
    h += `<p class="catatan">Belum ada siswa kelas ${S.kelas} yang mengirim nilai lewat tautanmu.</p>`;
  } else {
    h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Materi dikerjakan</th><th>Rata-rata</th></tr></thead><tbody>`;
    siswa.forEach(sw=>{
      const nilai = Object.values(sw.materi);
      const rata = Math.round(nilai.reduce((a,b)=>a+b,0)/nilai.length);
      h += `<tr><td>${esc(sw.nama)}</td><td>${nilai.length} dari ${DATA[S.kelas].length}</td><td class="nilai">${rata}</td></tr>`;
      Object.entries(sw.materi).forEach(([nm,nl])=>{
        h += `<tr style="background:var(--kapur)"><td colspan="2" style="padding-left:18px;font-size:13px">${esc(nm)}</td>
          <td style="font-size:13px">${nl}</td></tr>`;
      });
    });
    h += `</tbody></table></div>
      <p class="catatan">${siswa.length} siswa kelas ${S.kelas}. Rincian per soal dan pemeriksaan pengiriman ganda ada di tab Penilaian tiap materi.</p>`;
  }
  return h + `<p class="catatan" id="pesanbuka" style="margin:8px 0 0"></p></div>`;
}

/* ---------- beranda ---------- */
function tampilBeranda(){
  const total = Object.values(DATA).reduce((a,b)=>a+b.length,0);
  const selesai = Object.keys(progresAktif()).length;
  const sapa = S.peran==="siswa"
    ? "Pilih kelasmu, lalu pilih materi yang ingin dipelajari hari ini."
    : "Pilih kelas untuk membuka bank modul, alur kegiatan, lembar penilaian, dan alat bantu mengajar.";
  let h = barisAkun() + `<p class="eyebrow">${S.peran==="siswa"?"Menu siswa":"Menu guru"}</p>
    <h2>${S.peran==="siswa"?"Belajar Gerak":"Perangkat Mengajar"}</h2>
    <p class="catatan">${sapa}</p>
    <input class="cari" id="cari" placeholder="Cari materi, misal: lompat, voli, kebugaran" value="${esc(S.cari)}" autocomplete="off">`;

  if(S.cari.trim()){
    const q = S.cari.toLowerCase();
    const hasil = [];
    for(let k=1;k<=6;k++) DATA[k].forEach((m,i)=>{
      const mm = materiAktif(k,i);
      if((mm.j+" "+mm.e).toLowerCase().includes(q)) hasil.push({k,i,m:mm});
    });
    h += `<p class="eyebrow">Hasil pencarian (${hasil.length})</p>`;
    if(hasil.length===0) h += `<p class="catatan">Materi tidak ditemukan. Coba kata lain seperti "lari", "bola", atau "senam".</p>`;
    hasil.forEach(r=> h += kartuMateri(r.m,r.k,r.i));
  } else {
    if(S.peran==="guru") h += panelSiswaGuru();
    if(S.peran==="siswa"){
      h += `<div class="progres"><div class="baris"><span class="catatan">Progres belajarmu</span><b>${selesai}/${total}</b></div>
        <div class="bar"><span style="width:${Math.round(selesai/total*100)}%"></span></div></div>`;
    }
    const akun = akunAktif();
    const kunciKelas = S.peran==="siswa" && akun && akun.kelas && !S.lihatKelasLain;
    if(kunciKelas){
      S.kelas = akun.kelas;
      h += `<p class="eyebrow">Materi untukmu</p>`;
    } else {
      h += `<p class="eyebrow">Pilih kelas</p><div class="kelas-baris">`;
      for(let i=1;i<=6;i++) h += `<button class="nomor" aria-pressed="${S.kelas===i}" data-kelas="${i}">${i}<small>Kelas</small></button>`;
      h += `</div>`;
      if(S.peran==="siswa" && akun && akun.kelas){
        h += `<p style="margin:12px 0 0"><button class="tombol garis" id="balikkelas">Kembali ke kelas ${akun.kelas}</button></p>`;
      }
    }
    if(S.kelas){
      h += `<div class="fase"><b>${FASE[S.kelas].f} · Kelas ${S.kelas}</b>${FASE[S.kelas].d}</div>
        <p class="eyebrow">Materi kelas ${S.kelas}</p>`;
      DATA[S.kelas].forEach((m,i)=> h += kartuMateri(materiAktif(S.kelas,i),S.kelas,i));
      if(S.peran==="guru") h += panelNilaiKelas();
      const akun2 = akunAktif();
      if(S.peran==="siswa" && akun2 && akun2.kelas && !S.lihatKelasLain){
        h += `<p style="margin:14px 0 0"><button class="tombol garis" id="kelaslain">Lihat materi kelas lain</button></p>`;
      }
    }
  }
  h += `<footer>Prototipe versi pengembangan. Setiap materi dilengkapi animasi peragaan gerak, kuis, dan perangkat guru. Tiga materi contoh per kelas sudah terisi penuh.</footer>`;
  isi.innerHTML = h;

  const kl2 = document.getElementById("kelaslain");
  if(kl2) kl2.onclick = ()=>{ S.lihatKelasLain = true; tampilBeranda(); };
  const bk2 = document.getElementById("balikkelas");
  if(bk2) bk2.onclick = ()=>{ S.lihatKelasLain = false; S.kelas = akunAktif().kelas; tampilBeranda(); };
  pasangPanelSiswa();
  const ga = document.getElementById("gantiakun");
  if(ga) ga.onclick = ()=>{ S.siswaAktif=null; S.kelas=null; S.materi=null; render(); };
  pasangGantiKelas();
  const c = document.getElementById("cari");
  c.oninput = ()=>{ S.cari=c.value; const pos=c.selectionStart; tampilBeranda();
    const b=document.getElementById("cari"); b.focus(); b.setSelectionRange(pos,pos); };
  isi.querySelectorAll("[data-kelas]").forEach(b=>b.onclick=()=>{ S.kelas=Number(b.dataset.kelas); tampilBeranda(); });
  isi.querySelectorAll("[data-buka]").forEach(b=>b.onclick=()=>{
    const [k,i]=b.dataset.buka.split("-").map(Number);
    S.kelas=k; S.materi=i; S.tab=0; S.jawab={}; S.nilai=[]; S.ubah=false; S.draftKuis=null; render();
  });
}
function kartuMateri(m,k,i){
  const sudah = progresAktif()[`${k}-${i}`]!==undefined;
  const lencana = (S.peran==="siswa" && sudah) ? `<span class="lencana">Selesai</span>` : "";
  return `<button class="kartu" data-buka="${k}-${i}">
    <span class="jalur"></span>
    <span class="kartu-teks"><span class="el">Kelas ${k} · ${esc(m.e)}</span><span class="jd">${esc(m.j)}</span></span>
    ${lencana}<span class="panah">›</span></button>`;
}

/* ---------- materi gabungan: bawaan + suntingan guru ---------- */
function materiAktif(k,i){
  const asli = {...DATA[k][i], ml: MATERI_LENGKAP[`${k}-${i}`]||""};
  const ubah = S.sunting[`${k}-${i}`];
  if(!ubah) return asli;
  return {...asli, ...ubah, g:{...asli.g, ...(ubah.g||{})}};
}
function adaSuntingan(k,i){ return !!S.sunting[`${k}-${i}`]; }
function simpanSunting(bagian){
  const k = kunciMateri();
  const lama = S.sunting[k] || {};
  const gabung = {...lama, ...bagian, g:{...(lama.g||{}), ...(bagian.g||{})}};
  if(!Object.keys(gabung.g).length) delete gabung.g;
  S.sunting[k] = gabung;
  return simpanData();
}
function baris(t){ return String(t||"").split("\n").map(x=>x.trim()).filter(Boolean); }
function isiKolom(nilai){ return esc(Array.isArray(nilai) ? nilai.join("\n") : (nilai||"")); }
/* ---------- halaman materi ---------- */
function tampilMateri(){
  const m = materiAktif(S.kelas,S.materi);
  const tabs = TAB[S.peran].map(x=>x[1]);
  if(S.tab >= tabs.length) S.tab = 0;
  let h = barisAkun() + `<button class="balik" id="balik">‹ Kembali ke daftar materi</button>
    <p class="eyebrow">Kelas ${S.kelas} · ${esc(m.e)}</p>
    <h2>${esc(m.j)}</h2>
    <div class="tab" role="group" aria-label="Bagian materi">`;
  tabs.forEach((t,i)=> h += `<button data-tab="${i}" aria-pressed="${S.tab===i}">${t}</button>`);
  h += `</div><div class="panel" id="panel"></div>`;
  isi.innerHTML = h;
  document.getElementById("balik").onclick = ()=>{ S.materi=null; S.ubah=false; S.draftKuis=null; hentikanJam(); render(); };
  const ga2 = document.getElementById("gantiakun");
  if(ga2) ga2.onclick = ()=>{ S.siswaAktif=null; S.kelas=null; S.materi=null; render(); };
  pasangGantiKelas();
  isi.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    S.tab=Number(b.dataset.tab); S.ubah=false; S.draftKuis=null; hentikanJam();
    isi.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed", Number(x.dataset.tab)===S.tab));
    panel();
  });
  panel();
}

function kunciMateri(){ return `${S.kelas}-${S.materi}`; }
function daftarGambar(){
  const k = kunciMateri();
  return (GAMBAR[k]||[]).map(src=>({src,tetap:true}))
    .concat((S.gambar[k]||[]).map(src=>({src,tetap:false})));
}
function blokPeraga(m){
  const foto = daftarGambar();
  const pakaiFoto = foto.length>0 && !S.paksaAnimasi;
  if(S.fotoAktif >= foto.length) S.fotoAktif = 0;

  let h = `<div class="panggung">`;
  h += pakaiFoto
    ? `<img class="foto" src="${foto[S.fotoAktif].src}" alt="Peragaan gerak ${esc(m.j)}">`
    : svgGerak(m.a);
  h += `<p class="keterangan">${esc(m.ak)}</p></div>`;

  if(pakaiFoto && foto.length>1){
    h += `<div class="mini" role="group" aria-label="Pilih gambar">` +
      foto.map((f,i)=>`<button data-foto="${i}" aria-pressed="${S.fotoAktif===i}"><img src="${f.src}" alt="Gambar ${i+1}"></button>`).join("") + `</div>`;
  }

  h += `<div class="kendali">`;
  if(foto.length>0) h += `<button id="tukar" aria-pressed="${!pakaiFoto}">${pakaiFoto?"Lihat animasi":"Lihat gambar"}</button>`;
  if(!pakaiFoto){
    h += `<button id="jeda" aria-pressed="${S.jeda}">${S.jeda?"▶ Putar":"❚❚ Jeda"}</button>
          <button id="lambat" aria-pressed="${S.lambat}">Gerak lambat</button>`;
  }
  if(S.peran==="guru"){
    h += `<label class="unggah">+ Unggah gambar<input type="file" id="unggah" accept="image/*" multiple></label>`;
    if(pakaiFoto && !foto[S.fotoAktif].tetap) h += `<button id="hapusfoto">Hapus gambar ini</button>`;
  }
  h += `</div>`;
  if(S.peran==="guru"){
    h += CARA_SIMPAN==="perangkat"
      ? `<p class="catatan">Gambar tersimpan di perangkat ini dan tetap ada setelah aplikasi ditutup. Gambar hanya hilang bila kamu menghapusnya sendiri.</p>`
      : `<p class="catatan">Penyimpanan perangkat belum aktif di browser ini, jadi gambar hanya bertahan selama halaman dibuka. Buka file lewat browser Chrome atau Firefox agar tersimpan permanen.</p>`;
  }
  return h;
}
function pasangKendali(){
  const svg = document.querySelector("svg.gerak");
  if(svg){
    svg.classList.toggle("jeda",S.jeda); svg.classList.toggle("lambat",S.lambat);
    const j=document.getElementById("jeda"), l=document.getElementById("lambat");
    if(j) j.onclick=()=>{ S.jeda=!S.jeda; svg.classList.toggle("jeda",S.jeda);
      j.textContent=S.jeda?"▶ Putar":"❚❚ Jeda"; j.setAttribute("aria-pressed",S.jeda); };
    if(l) l.onclick=()=>{ S.lambat=!S.lambat; svg.classList.toggle("lambat",S.lambat);
      l.setAttribute("aria-pressed",S.lambat); };
  }
  const t=document.getElementById("tukar");
  if(t) t.onclick=()=>{ S.paksaAnimasi=!S.paksaAnimasi; panel(); };
  document.querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>{ S.fotoAktif=Number(b.dataset.foto); panel(); });
  const u=document.getElementById("unggah");
  if(u) u.onchange=async ()=>{
    const k=kunciMateri(); const berkas=[...u.files]; if(!berkas.length) return;
    for(const f of berkas){
      const data = await kecilkan(f);
      if(data) (S.gambar[k]=S.gambar[k]||[]).push(data);
    }
    await simpanData();
    S.paksaAnimasi=false; S.fotoAktif=daftarGambar().length-1; panel();
  };
  const hp=document.getElementById("hapusfoto");
  if(hp) hp.onclick=async ()=>{
    const k=kunciMateri(), tetap=(GAMBAR[k]||[]).length;
    S.gambar[k].splice(S.fotoAktif-tetap,1);
    if(S.gambar[k].length===0) delete S.gambar[k];
    await simpanData();
    S.fotoAktif=0; panel();
  };
}

function tombolUbah(){
  const sdh = adaSuntingan(S.kelas,S.materi);
  return `<div class="kendali" style="margin-top:0">
    <button id="ubah" aria-pressed="${S.ubah}">${S.ubah?"Batal":"✎ Ubah bagian ini"}</button>
    ${sdh?`<button id="pulihbawaan">Kembalikan ke bawaan</button>`:""}
    ${sdh?`<span class="lencana" style="align-self:center">Sudah disesuaikan</span>`:""}
  </div>`;
}
function pasangUbah(p,m){
  const b = document.getElementById("ubah");
  if(b) b.onclick = ()=>{ S.ubah=!S.ubah; panel(); };
  const r = document.getElementById("pulihbawaan");
  if(r) r.onclick = async ()=>{
    if(!confirm("Kembalikan seluruh isi materi ini ke versi bawaan aplikasi?")) return;
    delete S.sunting[kunciMateri()]; await simpanData(); S.ubah=false; tampilMateri();
  };
  const sp = document.getElementById("simpanubah");
  if(sp) sp.onclick = async ()=>{
    const ambil = id => (document.getElementById(id)||{}).value;
    const id = tabAktif();
    if(id==="modul"){
      await simpanSunting({ j:(ambil("f-j")||m.j).trim(), e:(ambil("f-e")||m.e).trim(),
        ak:(ambil("f-ak")||m.ak).trim(), t:baris(ambil("f-t")), l:baris(ambil("f-l")) });
    } else if(id==="materi"){
      await simpanSunting({ ml: ambil("f-ml").trim() });
    } else if(id==="alur"){
      const permainan = baris(ambil("f-p")).map(x=>{
        const [n,...sisa] = x.split("|");
        return {n:(n||"").trim(), d:sisa.join("|").trim()};
      }).filter(x=>x.n);
      await simpanSunting({ p:permainan.length?permainan:m.p,
        g:{ pe:ambil("f-pe").trim(), in:ambil("f-in").trim(), pu:ambil("f-pu").trim() } });
    } else if(id==="alat"){
      await simpanSunting({ g:{ alat:baris(ambil("f-alat")) } });
    } else if(id==="nilai"){
      const asp = baris(ambil("f-r"));
      if(asp.length){ await simpanSunting({ g:{ r:asp } }); S.nilai=[]; }
    }
    S.ubah=false; tampilMateri();
  };
}
function formUbah(m){
  const kotak = (label,id,nilai,tinggi,bantu)=>`<h3>${label}</h3>
    ${bantu?`<p class="catatan" style="margin-top:-4px">${bantu}</p>`:""}
    <textarea id="${id}" style="min-height:${tinggi}px">${isiKolom(nilai)}</textarea>`;
  const satuBaris = (label,id,nilai)=>`<h3>${label}</h3>
    <input class="cari" id="${id}" value="${esc(nilai)}">`;
  const id = tabAktif();
  let h = "";
  if(id==="modul"){
    h = satuBaris("Judul materi","f-j",m.j) + satuBaris("Elemen","f-e",m.e)
      + kotak("Kalimat penekanan teknik","f-ak",m.ak,70)
      + kotak("Tujuan pembelajaran","f-t",m.t,110,"Satu tujuan per baris.")
      + kotak("Materi pokok / langkah gerak","f-l",m.l,140,"Satu langkah per baris, urut.");
  } else if(id==="materi"){
    h = kotak("Materi lengkap","f-ml",m.ml,320,"Tulis bebas. Beri baris kosong untuk memisahkan paragraf. Baris pendek tanpa titik akan ditampilkan sebagai subjudul.");
  } else if(id==="alur"){
    h = kotak("Kegiatan pendahuluan","f-pe",m.g.pe,90)
      + kotak("Kegiatan inti","f-in",m.g.in,110)
      + kotak("Kegiatan penutup","f-pu",m.g.pu,90)
      + kotak("Permainan","f-p",m.p.map(x=>`${x.n} | ${x.d}`),120,"Satu permainan per baris. Pisahkan nama dan penjelasan dengan tanda |");
  } else if(id==="alat"){
    h = kotak("Alat dan bahan","f-alat",m.g.alat,130,"Satu alat per baris.");
  } else if(id==="nilai"){
    h = kotak("Aspek penilaian","f-r",m.g.r,110,"Satu aspek per baris. Tabel penilaian mengikuti daftar ini.");
  }
  return h + `<p style="margin-top:14px"><button class="tombol" id="simpanubah">Simpan perubahan</button></p>
    <p class="catatan">Perubahan tersimpan di perangkat ini dan langsung dipakai di menu siswa.</p>`;
}

/* ---------- materi lengkap ---------- */
function tampilMateriLengkap(m){
  if(!m.ml.trim()) return `<p class="catatan">Materi lengkap belum diisi untuk bagian ini.</p>`;
  return m.ml.split(/\n\s*\n/).map(bagian=>{
    const baris2 = bagian.split("\n");
    let h = "";
    baris2.forEach((b,i)=>{
      const t = b.trim(); if(!t) return;
      if(i===0 && t.length<60 && !/[.!?]$/.test(t)) h += `<h3${h?"":' style="margin-top:0"'}>${esc(t)}</h3>`;
      else h += `<p>${esc(t)}</p>`;
    });
    return h;
  }).join("");
}

/* ---------- video peraga ---------- */
function idYoutube(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function daftarVideo(){ return S.video[kunciMateri()] || []; }
function blokVideo(m){
  const v = daftarVideo();
  let h = `<h3 style="margin-top:0">Video pembelajaran</h3>`;
  if(v.length===0){
    h += `<p class="catatan">${S.peran==="guru"
      ? "Belum ada video. Unggah video animasi dari perangkat, atau tempel tautan YouTube di bawah ini."
      : "Belum ada video untuk materi ini. Gunakan tab Gerakan untuk melihat peragaan geraknya."}</p>`;
  }
  v.forEach((item,i)=>{
    h += `<div class="main" style="border-style:solid">
      <b>${esc(item.judul || (item.jenis==="youtube"?"Video YouTube":"Video dari perangkat"))}</b>`;
    h += item.jenis==="youtube"
      ? `<div class="bingkai"><iframe src="https://www.youtube.com/embed/${item.id}" title="${esc(item.judul||"Video pembelajaran")}" allowfullscreen loading="lazy"></iframe></div>`
      : `<video class="video" src="${item.src}" controls playsinline preload="metadata"></video>`;
    if(item.jenis==="youtube") h += `<p class="catatan" style="margin:8px 0 0">Video YouTube memerlukan koneksi internet.</p>`;
    if(S.peran==="guru") h += `<div class="kendali"><button data-hapusvid="${i}">Hapus video ini</button></div>`;
    h += `</div>`;
  });
  if(S.peran==="guru"){
    h += `<h3>Tambah video</h3>
      <div class="kendali"><label class="unggah">+ Unggah video dari perangkat<input type="file" id="unggahvideo" accept="video/*"></label></div>
      <p class="catatan">Ukuran video sebaiknya di bawah 25 MB agar penyimpanan perangkat tidak penuh. Video tersimpan permanen dan bisa diputar tanpa internet.</p>
      <div class="isian" style="margin-top:10px">
        <input id="tautan" placeholder="Tempel tautan YouTube" autocomplete="off">
        <input id="judulvid" placeholder="Judul video (opsional)" autocomplete="off">
        <button class="tombol" id="tambahtautan">Tambah tautan</button>
      </div>
      <p class="catatan" id="pesanvideo"></p>`;
  }
  return h;
}
function pasangVideo(p,m){
  p.querySelectorAll("[data-hapusvid]").forEach(b=>b.onclick=async ()=>{
    if(!confirm("Hapus video ini?")) return;
    const k = kunciMateri();
    S.video[k].splice(Number(b.dataset.hapusvid),1);
    if(!S.video[k].length) delete S.video[k];
    await simpanData(); panel();
  });
  const uv = document.getElementById("unggahvideo");
  if(uv) uv.onchange = ()=>{
    const f = uv.files[0]; if(!f) return;
    const pesan = document.getElementById("pesanvideo");
    if(f.size > 25*1024*1024){ pesan.textContent = "Video terlalu besar (lebih dari 25 MB). Perpendek durasinya atau turunkan resolusinya lebih dulu."; return; }
    pesan.textContent = "Sedang memproses video...";
    const r = new FileReader();
    r.onload = async ()=>{
      const k = kunciMateri();
      (S.video[k] = S.video[k]||[]).push({jenis:"berkas", src:r.result, judul:f.name.replace(/\.[^.]+$/,"")});
      const berhasil = await simpanData();
      panel();
      if(!berhasil) document.getElementById("pesanvideo").textContent = "Video tampil, tetapi penyimpanan perangkat penuh atau tidak aktif sehingga tidak tersimpan permanen.";
    };
    r.onerror = ()=>{ pesan.textContent = "Video gagal dibaca."; };
    r.readAsDataURL(f);
  };
  const tt = document.getElementById("tambahtautan");
  if(tt) tt.onclick = async ()=>{
    const url = document.getElementById("tautan").value.trim();
    const judul = document.getElementById("judulvid").value.trim();
    const id = idYoutube(url);
    if(!id){ document.getElementById("pesanvideo").textContent = "Tautan tidak dikenali. Salin tautan lengkap dari YouTube."; return; }
    const k = kunciMateri();
    (S.video[k] = S.video[k]||[]).push({jenis:"youtube", id, judul});
    await simpanData(); panel();
  };
}

/* ---------- daftar tab ---------- */
const TAB = {
  siswa:[["tujuan","Tujuan"],["gerak","Gerakan"],["video","Video"],["materi","Materi Lengkap"],["main","Ayo Bermain"],["kuis","Kuis"]],
  guru:[["modul","Modul Singkat"],["materi","Materi Lengkap"],["video","Video"],["alur","Alur Kegiatan"],["alat","Alat & Bahan"],["kuis","Kuis"],["nilai","Penilaian"],["bantu","Alat Bantu"]]
};
function tabAktif(){ const d = TAB[S.peran]; return (d[S.tab]||d[0])[0]; }

function panel(){
  const m = materiAktif(S.kelas,S.materi), p = document.getElementById("panel");
  const id = tabAktif();

  if(S.peran==="siswa"){
    if(id==="tujuan"){
      p.innerHTML = `<h3 style="margin-top:0">Yang akan kamu capai</h3><ul class="rapi">${m.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    } else if(id==="gerak"){
      p.innerHTML = `<h3 style="margin-top:0">Lihat gerakannya</h3>${blokPeraga(m)}
        <h3>Lakukan berurutan</h3><ol class="langkah">${m.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
      pasangKendali();
    } else if(id==="video"){
      p.innerHTML = blokVideo(m);
    } else if(id==="materi"){
      p.innerHTML = tampilMateriLengkap(m);
    } else if(id==="main"){
      p.innerHTML = `<h3 style="margin-top:0">Permainan latihan</h3>${m.p.map(x=>`<div class="main"><b>${esc(x.n)}</b>${esc(x.d)}</div>`).join("")}`;
    } else kuis(p,m);
    return;
  }

  if(id==="bantu"){ alatBantu(p,m); return; }
  if(id==="kuis"){ editorKuis(p,m); return; }
  if(id==="video"){ p.innerHTML = blokVideo(m); pasangVideo(p,m); return; }
  if(S.ubah){ p.innerHTML = tombolUbah() + formUbah(m); pasangUbah(p,m); return; }

  if(id==="modul"){
    p.innerHTML = tombolUbah() + `<h3>Peragaan gerak untuk ditayangkan</h3>${blokPeraga(m)}
      <h3>Capaian pembelajaran</h3><p>${FASE[S.kelas].f} — ${esc(FASE[S.kelas].d)}</p>
      <h3>Tujuan pembelajaran</h3><ul class="rapi">${m.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <h3>Materi pokok</h3><ol class="langkah">${m.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    pasangKendali();
  } else if(id==="materi"){
    p.innerHTML = tombolUbah() + tampilMateriLengkap(m);
  } else if(id==="alur"){
    p.innerHTML = tombolUbah() + `<h3>Kegiatan pendahuluan</h3><p>${esc(m.g.pe)}</p>
      <h3>Kegiatan inti</h3><p>${esc(m.g.in)}</p>
      <h3>Kegiatan penutup</h3><p>${esc(m.g.pu)}</p>
      <h3>Permainan yang digunakan</h3>${m.p.map(x=>`<div class="main"><b>${esc(x.n)}</b>${esc(x.d)}</div>`).join("")}`;
  } else if(id==="alat"){
    p.innerHTML = tombolUbah() + `<h3>Alat dan bahan</h3><ul class="rapi">${m.g.alat.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <p class="catatan">Alat dapat diganti barang bekas yang aman apabila sarana sekolah terbatas.</p>`;
  } else if(id==="nilai"){ penilaian(p,m); }
  pasangUbah(p,m);
}

/* ---------- penyunting kuis untuk guru ---------- */
function editorKuis(p,m){
  if(!S.draftKuis) S.draftKuis = JSON.parse(JSON.stringify(m.k));
  const d = S.draftKuis;
  const sdh = adaSuntingan(S.kelas,S.materi);
  let h = `<div class="kendali" style="margin-top:0">
      <button class="tombol" id="simpankuis">Simpan kuis</button>
      <button id="tambahsoal">+ Tambah soal</button>
      ${sdh?`<button id="pulihkuis">Kembalikan kuis bawaan</button>`:""}
    </div>
    <p class="catatan">Ubah pertanyaan, pilihan jawaban, kunci jawaban, dan pembahasannya. Setiap soal boleh diberi satu gambar.</p>`;

  d.forEach((q,i)=>{
    h += `<div class="main" style="border-style:solid">
      <div class="baris-soal"><b>Soal ${i+1}</b>
        <button class="hapus" data-hapussoal="${i}" aria-label="Hapus soal ${i+1}">✕</button></div>
      <h3 style="margin-top:8px">Pertanyaan</h3>
      <textarea data-f="s" data-i="${i}" style="min-height:66px">${esc(q.s)}</textarea>
      <h3>Pilihan jawaban</h3>
      <p class="catatan" style="margin-top:-4px">Satu pilihan per baris, dua sampai empat pilihan.</p>
      <textarea data-f="o" data-i="${i}" style="min-height:88px">${esc(q.o.join("\n"))}</textarea>
      <h3>Kunci jawaban</h3>
      <select data-f="a" data-i="${i}" style="padding:9px;border:2px solid var(--garis);border-radius:10px;font-family:var(--teks);font-size:15px;background:#fff;width:100%">
        ${q.o.map((o,j)=>`<option value="${j}" ${j===q.a?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
      <h3>Pembahasan</h3>
      <textarea data-f="x" data-i="${i}" style="min-height:66px">${esc(q.x)}</textarea>
      <h3>Gambar soal</h3>`;
    h += q.img
      ? `<img class="foto" src="${q.img}" alt="Gambar soal ${i+1}" style="max-height:190px;border-radius:10px">
         <div class="kendali"><button data-hapusgbr="${i}">Hapus gambar soal</button></div>`
      : `<div class="kendali"><label class="unggah">+ Unggah gambar soal<input type="file" data-gbr="${i}" accept="image/*"></label></div>`;
    h += `</div>`;
  });

  if(d.length===0) h += `<p class="kosong">Belum ada soal. Tekan Tambah soal untuk mulai menyusun.</p>`;
  h += `<p class="catatan" id="pesankuis"></p>`;
  p.innerHTML = h;

  p.querySelectorAll("[data-f]").forEach(el=>{
    el.onchange = ()=>{
      const i = Number(el.dataset.i);
      if(el.dataset.f==="o"){
        const pil = baris(el.value).slice(0,4);
        if(pil.length>=2){ d[i].o = pil; if(d[i].a>=pil.length) d[i].a=0; }
        editorKuis(p,m); return;
      }
      if(el.dataset.f==="a") d[i].a = Number(el.value);
      else d[i][el.dataset.f] = el.value.trim();
    };
  });
  p.querySelectorAll("[data-hapussoal]").forEach(b=>b.onclick=()=>{
    if(!confirm("Hapus soal ini?")) return;
    d.splice(Number(b.dataset.hapussoal),1); editorKuis(p,m);
  });
  p.querySelectorAll("[data-gbr]").forEach(el=>el.onchange=async ()=>{
    const f = el.files[0]; if(!f) return;
    const data = await kecilkan(f);
    if(data){ d[Number(el.dataset.gbr)].img = data; editorKuis(p,m); }
  });
  p.querySelectorAll("[data-hapusgbr]").forEach(b=>b.onclick=()=>{
    delete d[Number(b.dataset.hapusgbr)].img; editorKuis(p,m);
  });
  document.getElementById("tambahsoal").onclick = ()=>{
    d.push({s:"Pertanyaan baru",o:["Pilihan A","Pilihan B","Pilihan C"],a:0,x:"Penjelasan jawaban benar."});
    editorKuis(p,m);
  };
  document.getElementById("simpankuis").onclick = async ()=>{
    const sah = d.filter(q=>q.s.trim() && q.o.length>=2);
    if(!sah.length){ document.getElementById("pesankuis").textContent="Kuis harus berisi minimal satu soal dengan dua pilihan jawaban."; return; }
    await simpanSunting({k:sah});
    S.draftKuis=null; S.jawab={};
    editorKuis(p,materiAktif(S.kelas,S.materi));
    document.getElementById("pesankuis").textContent="Kuis tersimpan dan langsung dipakai di menu siswa.";
  };
  const pk = document.getElementById("pulihkuis");
  if(pk) pk.onclick = async ()=>{
    if(!confirm("Kembalikan kuis materi ini ke soal bawaan aplikasi?")) return;
    const k = kunciMateri();
    if(S.sunting[k]){ delete S.sunting[k].k; if(!Object.keys(S.sunting[k]).length) delete S.sunting[k]; }
    await simpanData(); S.draftKuis=null; S.jawab={}; panel();
  };
}

/* ---------- kuis ---------- */
function kuis(p,m){
  const kunci = `${S.kelas}-${S.materi}`;
  const hasil = progresAktif()[kunci];

  if(hasil!==undefined){
    p.innerHTML = `<div class="skor"><div class="angka">✓</div>
      <p>Kuis materi ini sudah kamu kerjakan dan jawabanmu sudah terkirim ke guru.</p></div>
      ${S.antrian.length ? `<p class="catatan" style="margin-top:12px">Ada ${S.antrian.length} hasil yang belum sampai ke guru karena internet terputus. Buka aplikasi ini lagi saat ada internet, hasilnya akan terkirim sendiri.</p>`
        : `<p class="catatan" style="margin-top:12px">Hasilnya akan disampaikan gurumu. Kalau ingin mengerjakan ulang, mintalah gurumu membuka kembali kuis ini.</p>`}`;
    return;
  }

  let h = `<h3 style="margin-top:0">Uji pemahaman</h3>
    <p class="catatan">Pilih satu jawaban untuk tiap soal. Jawaban masih bisa kamu ubah sebelum dikirim.</p>`;
  m.k.forEach((q,i)=>{
    h += `<div class="soal"><div class="no">Soal ${i+1} dari ${m.k.length}</div>`;
    if(q.img) h += `<img class="foto" src="${q.img}" alt="Gambar soal ${i+1}" style="max-height:210px;border-radius:10px;margin-bottom:10px">`;
    h += `<div class="tanya">${esc(q.s)}</div>`;
    q.o.forEach((o,j)=>{
      const dipilih = S.jawab[i]===j;
      h += `<button class="pilihan${dipilih?" dipilih":""}" data-s="${i}" data-o="${j}" aria-pressed="${dipilih}">${esc(o)}</button>`;
    });
    h += `</div>`;
  });
  const lengkap = Object.keys(S.jawab).length===m.k.length;
  h += `<p class="catatan">${lengkap?"Semua soal sudah terisi.":`Terisi ${Object.keys(S.jawab).length} dari ${m.k.length} soal.`}</p>
    <button class="tombol" id="kirimkuis" ${lengkap?"":"disabled style=opacity:.5"}>Kirim jawaban</button>`;
  p.innerHTML = h;

  p.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ S.jawab[b.dataset.s]=Number(b.dataset.o); kuis(p,m); });
  const kirim = document.getElementById("kirimkuis");
  if(kirim && lengkap) kirim.onclick = async ()=>{
    const benar = m.k.filter((q,i)=>S.jawab[i]===q.a).length;
    const nilai = Math.round(benar/m.k.length*100);
    progresAktif()[kunci] = {n:nilai, b:benar, t:m.k.length, tgl:new Date().toISOString().slice(0,10)};
    const a = akunAktif();
    if(a && S.server){
      S.antrian.push({nama:a.nama, kelas:a.kelas||"", materi:m.j, kelasMateri:S.kelas,
                      benar, total:m.k.length, nilai, perangkat:idPerangkat(),
                      kodeKelas: a.kodeKelas || S.kodeUndangan || S.kodeKelas || ""});
    }
    if(S.siswaAktif) await simpanData();
    S.jawab = {};
    p.innerHTML = `<p class="catatan">Mengirim jawaban...</p>`;
    await kirimAntrian();
    kuis(p, m);
  };
}

/* ---------- penilaian ---------- */
function kelompokHasil(m){
  const data = (S.hasilServer||[]).filter(x=>String(x.materi)===String(m.j));
  const peta = {};
  data.forEach(x=>{
    const kunci = `${m.j}|${String(x.nama).trim().toLowerCase()}|${x.kelas}`;
    (peta[kunci] = peta[kunci] || {kunci, nama:String(x.nama).trim(), kelas:x.kelas, kirim:[]}).kirim.push(x);
  });
  const hasil = Object.values(peta);
  hasil.forEach(g=>{
    g.kirim.sort((a,b)=> String(a.waktu).localeCompare(String(b.waktu)));
    const pilih = S.pilihanNilai[g.kunci];
    g.pilih = (pilih!==undefined && pilih < g.kirim.length) ? pilih : 0;
  });
  return hasil.sort((a,b)=> (a.kelas-b.kelas) || a.nama.localeCompare(b.nama));
}
function hasilKuisMateri(m){
  const kunci = `${S.kelas}-${S.materi}`;
  const baris = Object.entries(S.akun)
    .filter(([id,a])=>a.progres && a.progres[kunci]!==undefined)
    .map(([id,a])=>({id, nama:a.nama, kelas:a.kelas||"–", h:a.progres[kunci]}))
    .sort((x,y)=> (x.kelas+"").localeCompare(y.kelas+"") || x.nama.localeCompare(y.nama));
  let h = `<h3 style="margin-top:0">Hasil kuis siswa</h3>`;
  if(baris.length===0){
    h += `<p class="catatan">Belum ada siswa yang mengerjakan kuis materi ini di perangkat ini.</p>`;
  } else {
    h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Benar</th><th>Nilai</th><th>Tanggal</th><th></th></tr></thead><tbody>`;
    baris.forEach(r=>{
      const nilai = nilaiDari(r.h);
      const benar = typeof r.h==="object" ? `${r.h.b}/${r.h.t}` : "–";
      const tgl = typeof r.h==="object" ? (r.h.tgl||"–") : "–";
      h += `<tr><td>${esc(r.nama)}</td><td>${r.kelas}</td><td>${benar}</td>
        <td class="nilai">${nilai}</td><td>${tgl}</td>
        <td><button class="hapus" data-bukakuis="${r.id}" title="Buka kembali kuis untuk siswa ini" aria-label="Buka kembali kuis ${esc(r.nama)}">↺</button></td></tr>`;
    });
    const rata = Math.round(baris.reduce((x,r)=>x+nilaiDari(r.h),0)/baris.length);
    h += `</tbody></table></div>
      <p class="catatan">${baris.length} siswa mengerjakan · rata-rata nilai ${rata}. Tombol ↺ membuka kembali kuis agar siswa dapat mengerjakan ulang.</p>
      <p><button class="tombol garis" id="salinkuis">Salin hasil kuis</button></p>
      <p class="catatan" id="pesankuisguru"></p>`;
  }
  h += `<h3>Hasil dari server daring</h3>`;
  if(!S.server){
    h += `<p class="catatan">Server nilai belum diatur. Isi alamatnya di tab Alat Bantu agar nilai siswa yang mengerjakan di rumah ikut masuk ke sini.</p>`;
  } else if(!S.kodeKelas){
    h += `<p class="catatan">Kamu belum punya kode kelas. Buat kode lebih dulu di halaman awal menu guru, lalu bagikan tautan siswa yang sudah berkode itu.</p>`;
  } else if(!S.bukaNilai){
    h += `<p class="catatan">Nilai terkunci. Buka dulu lewat halaman awal menu guru: pilih kelas, lalu masukkan kode guru pada kotak Nilai siswa.</p>`;
  } else if(!S.hasilServer){
    h += `<p class="catatan">Tekan tombol di bawah untuk mengambil nilai siswa dari Spreadsheet.</p>
      <p><button class="tombol" id="ambilserver">Ambil hasil dari server</button></p>
      <p class="catatan" id="pesanserverguru"></p>`;
  } else {
    h += `<p><button class="tombol garis" id="ambilserver">Muat ulang hasil</button></p>
      <p class="catatan" id="pesanserverguru"></p>`;
    const grup = kelompokHasil(m);
    if(grup.length===0){
      h += `<p class="catatan">Belum ada siswa yang mengirim nilai untuk materi ini.</p>`;
    } else {
      const ganda = grup.filter(g=>g.kirim.length>1);
      const bedaAlat = ganda.filter(g=>new Set(g.kirim.map(k=>k.perangkat)).size>1);
      h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Benar</th><th>Nilai dipakai</th><th>Waktu</th><th>Pengiriman</th></tr></thead><tbody>`;
      grup.forEach(g=>{
        const t = g.kirim[g.pilih];
        const tanda = g.kirim.length>1
          ? `<span class="lencana" style="background:#FDECE7;color:var(--lintasan)">${g.kirim.length}×</span>`
          : `1×`;
        h += `<tr><td>${esc(g.nama)}</td><td>${esc(g.kelas)}</td><td>${esc(t.benar)}/${esc(t.total)}</td>
          <td class="nilai">${esc(t.nilai)}</td><td>${esc(String(t.waktu).slice(0,16))}</td><td>${tanda}</td></tr>`;
        if(g.kirim.length>1){
          g.kirim.forEach((k,i)=>{
            const dipakai = i===g.pilih;
            h += `<tr style="background:var(--kapur)"><td colspan="2" style="padding-left:18px;font-size:13px">
                Pengiriman ${i+1} · perangkat ${esc(k.perangkat||"?")}</td>
              <td style="font-size:13px">${esc(k.benar)}/${esc(k.total)}</td>
              <td style="font-size:13px">${esc(k.nilai)}</td>
              <td style="font-size:13px">${esc(String(k.waktu).slice(0,16))}</td>
              <td>${dipakai?`<b style="font-size:12px">dipakai</b>`
                : `<button class="tombol garis" style="padding:4px 10px;font-size:12px" data-pakai="${esc(g.kunci)}|${i}">Pakai</button>`}</td></tr>`;
          });
        }
      });
      const rata = Math.round(grup.reduce((a,g)=>a+Number(g.kirim[g.pilih].nilai||0),0)/grup.length);
      h += `</tbody></table></div>
        <p class="catatan">${grup.length} siswa · rata-rata ${rata}. Nilai yang dipakai secara bawaan adalah pengiriman pertama.</p>`;
      if(ganda.length){
        h += `<div class="main" style="border-color:var(--lintasan)">
          <b>Perlu diperiksa: ${ganda.length} siswa mengirim lebih dari sekali</b>
          ${bedaAlat.length ? `${bedaAlat.length} di antaranya mengirim dari perangkat berbeda dengan nama yang sama — periksa apakah dikerjakan ulang sendiri atau dibantu orang lain. ` : ""}
          Pilih pengiriman mana yang dipakai lewat tombol Pakai pada baris abu-abu.</div>`;
      }
      h += `<p><button class="tombol garis" id="salindaring">Salin rekap nilai akhir</button></p>`;
    }
  }
  return h + `<hr style="border:0;border-top:1px solid var(--garis);margin:22px 0">`;
}
function pasangHasilKuis(p,m){
  p.querySelectorAll("[data-bukakuis]").forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.bukakuis, a = S.akun[id];
    if(!confirm(`Buka kembali kuis materi ini untuk ${a.nama}? Nilai lamanya akan terhapus.`)) return;
    delete a.progres[`${S.kelas}-${S.materi}`];
    await simpanData(); penilaian(p,m);
  });
  p.querySelectorAll("[data-pakai]").forEach(b=>b.onclick=async ()=>{
    const pisah = b.dataset.pakai.lastIndexOf("|");
    S.pilihanNilai[b.dataset.pakai.slice(0,pisah)] = Number(b.dataset.pakai.slice(pisah+1));
    await simpanData(); penilaian(p,m);
  });
  const sd = document.getElementById("salindaring");
  if(sd) sd.onclick = ()=>{
    const grup = kelompokHasil(m);
    let teks = `Rekap Nilai Kuis Daring\n${m.j}\n\n`;
    grup.forEach((g,i)=>{
      const t = g.kirim[g.pilih];
      teks += `${i+1}. ${g.nama} (Kelas ${g.kelas}) — ${t.benar}/${t.total} — nilai ${t.nilai}` +
              (g.kirim.length>1 ? ` [${g.kirim.length} pengiriman]` : "") + `\n`;
    });
    navigator.clipboard.writeText(teks).then(
      ()=>document.getElementById("pesanserverguru").textContent="Rekap nilai akhir tersalin.",
      ()=>document.getElementById("pesanserverguru").textContent="Penyalinan gagal.");
  };
  const as = document.getElementById("ambilserver");
  if(as) as.onclick = async ()=>{
    const kabar = document.getElementById("pesanserverguru");
    kabar.textContent = "Mengambil data...";
    const r = await ambilHasilServer();
    if(!r.ok){ kabar.textContent = r.pesan; return; }
    penilaian(p,m);
  };
  const sk = document.getElementById("salinkuis");
  if(sk) sk.onclick = ()=>{
    const kunci = `${S.kelas}-${S.materi}`;
    let teks = `Hasil Kuis PJOK\n${m.j} — Kelas ${S.kelas}\n\n`;
    Object.values(S.akun).filter(a=>a.progres && a.progres[kunci]!==undefined).forEach((a,i)=>{
      const hh = a.progres[kunci];
      teks += `${i+1}. ${a.nama} (Kelas ${a.kelas||"-"}) — ${typeof hh==="object"?hh.b+"/"+hh.t:"-"} benar — nilai ${nilaiDari(hh)}\n`;
    });
    navigator.clipboard.writeText(teks).then(
      ()=>document.getElementById("pesankuisguru").textContent="Hasil kuis tersalin. Tempel di Word, Excel, atau WhatsApp.",
      ()=>document.getElementById("pesankuisguru").textContent="Penyalinan gagal. Salin manual dari tabel di atas.");
  };
}

function penilaian(p,m){
  const asp = m.g.r;
  let h = tombolUbah() + hasilKuisMateri(m) + `<h3>Lembar penilaian keterampilan</h3>
    <p class="catatan">Skala 1–4 pada setiap aspek. Nilai akhir dihitung otomatis.</p>
    <div class="isian"><input id="nama" placeholder="Nama siswa" autocomplete="off">
    <button class="tombol" id="tambah">Tambah siswa</button></div>
    <div class="gulir"><table><thead><tr><th>Nama</th>${asp.map(a=>`<th>${esc(a)}</th>`).join("")}<th>Nilai</th><th></th></tr></thead><tbody>`;
  if(S.nilai.length===0){
    h += `<tr><td class="kosong" colspan="${asp.length+3}">Belum ada siswa. Tambahkan nama untuk mulai menilai.</td></tr>`;
  } else {
    S.nilai.forEach((s,i)=>{
      const nilai = Math.round(s.s.reduce((a,b)=>a+b,0)/(asp.length*4)*100);
      h += `<tr><td>${esc(s.n)}</td>`;
      s.s.forEach((v,j)=> h += `<td><select data-i="${i}" data-j="${j}">${[1,2,3,4].map(x=>`<option value="${x}" ${x===v?"selected":""}>${x}</option>`).join("")}</select></td>`);
      h += `<td class="nilai">${nilai}</td><td><button class="hapus" data-hapus="${i}" aria-label="Hapus ${esc(s.n)}">✕</button></td></tr>`;
    });
  }
  h += `</tbody></table></div>`;
  if(S.nilai.length>0) h += `<p style="margin-top:14px"><button class="tombol garis" id="salin">Salin rekap nilai</button></p><p class="catatan" id="pesan"></p>`;
  h += `<p class="catatan" style="margin-top:16px">Data hanya tersimpan selama halaman dibuka. Salin rekapnya sebelum menutup aplikasi.</p>`;
  p.innerHTML=h;

  const tambah = ()=>{ const el=document.getElementById("nama"), n=el.value.trim();
    if(!n){ el.focus(); return; } S.nilai.push({n, s:asp.map(()=>3)}); penilaian(p,m); document.getElementById("nama").focus(); };
  document.getElementById("tambah").onclick = tambah;
  document.getElementById("nama").onkeydown = e=>{ if(e.key==="Enter") tambah(); };
  p.querySelectorAll("td select").forEach(sel=>sel.onchange=()=>{ S.nilai[sel.dataset.i].s[sel.dataset.j]=Number(sel.value); penilaian(p,m); });
  p.querySelectorAll("[data-hapus]").forEach(b=>b.onclick=()=>{ S.nilai.splice(Number(b.dataset.hapus),1); penilaian(p,m); });
  pasangHasilKuis(p,m);
  pasangUbah(p,m);
  const sl=document.getElementById("salin");
  if(sl) sl.onclick=()=>{
    let teks = `Rekap Penilaian PJOK\nKelas ${S.kelas} — ${m.j}\nAspek: ${asp.join(", ")}\n\n`;
    S.nilai.forEach((s,i)=>{ const nilai=Math.round(s.s.reduce((a,b)=>a+b,0)/(asp.length*4)*100);
      teks += `${i+1}. ${s.n} — ${s.s.join("/")} — nilai ${nilai}\n`; });
    navigator.clipboard.writeText(teks).then(
      ()=>document.getElementById("pesan").textContent="Rekap tersalin. Tempel di WhatsApp, Word, atau Excel.",
      ()=>document.getElementById("pesan").textContent="Penyalinan gagal. Salin manual dari tabel di atas.");
  };
}

    <p class="catatan" id="pesannama"></p>

    <h3>Server nilai daring</h3>
    <p class="catatan">Isi alamat Web App Google Apps Script agar nilai kuis siswa yang mengerjakan di rumah otomatis masuk ke Spreadsheet milikmu. Kosongkan bila aplikasi hanya dipakai luring.</p>
    <div class="isian"><input id="alamatserver" value="${esc(S.server)}" placeholder="https://script.google.com/macros/s/..../exec" autocomplete="off"></div>
    <div class="kendali">
      <button class="tombol" id="simpanserver">Simpan alamat</button>
      <button id="ujiserver">Uji koneksi</button>
      <button id="salinskrip">Salin kode Apps Script</button>
    </div>
    <p class="catatan" id="pesanserver"></p>

    <h3>Bagikan ke perangkat lain</h3>
    <p class="catatan">Unduh salinan aplikasi yang sudah berisi gambar, video, dan modul hasil penyesuaianmu. File itulah yang dikirim ke guru lain atau diunggah ke internet, sehingga isinya sama persis di perangkat mana pun. Nilai dan akun siswa tidak ikut disertakan.</p>
    <div class="kendali"><button class="tombol" id="eksporapp">Unduh aplikasi siap dibagikan</button></div>
    <p class="catatan" id="pesanekspor"></p>
    <p class="catatan">File cadangan berguna untuk memindahkan gambar ke HP atau laptop lain, atau sebagai arsip sebelum aplikasi dipasang ulang.</p>
    <p class="catatan" id="pesangambar"></p>`;


  const jam = ()=>{ document.querySelector("#jam .angka").textContent = fmt(S.detik);
    document.getElementById("jam").classList.toggle("habis", S.mundur && S.detik===0); };
  const mulai = document.getElementById("mulai");
  mulai.onclick = ()=>{
    if(S.jalan){ hentikanJam(); mulai.textContent="Mulai"; return; }
    S.jalan=true; mulai.textContent="Jeda";
    S.tik=setInterval(()=>{
      if(S.mundur){ if(S.detik>0) S.detik--; else { hentikanJam(); mulai.textContent="Mulai"; } }
      else S.detik++;
      jam();
    },1000);
  };
  document.getElementById("nol").onclick = ()=>{ hentikanJam(); S.detik=0; S.mundur=false; mulai.textContent="Mulai"; alatBantu(p,m); };
  p.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{ hentikanJam(); S.mundur=true; S.detik=Number(b.dataset.set); alatBantu(p,m); });
  p.querySelectorAll("[data-poin]").forEach(b=>b.onclick=()=>{
    const [i,d]=b.dataset.poin.split("-"); const nilai=b.dataset.poin.endsWith("--1")?-1:1;
    S.regu[Number(i)]=Math.max(0,S.regu[Number(i)]+nilai); alatBantu(p,m); });
  document.getElementById("nolskor").onclick = ()=>{ S.regu=[0,0]; alatBantu(p,m); };
  document.getElementById("simpanregu").onclick = async ()=>{
    const a=document.getElementById("rnamaA").value.trim(), b=document.getElementById("rnamaB").value.trim();
    S.regunama=[a||"Regu A", b||"Regu B"]; await simpanData(); alatBantu(p,m);
  };
  document.getElementById("tambahdurasi").onclick = async ()=>{
    const teks = document.getElementById("durasi").value.toLowerCase();
    const angka = parseInt(teks,10);
    if(!angka || angka<1) return;
    const detik = teks.includes("menit") ? angka*60 : angka;
    if(!S.preset.includes(detik)) S.preset = [...S.preset, detik].sort((x,y)=>x-y).slice(0,6);
    await simpanData(); alatBantu(p,m);
  };
  document.getElementById("noldurasi").onclick = async ()=>{ S.preset=[30,60,120]; await simpanData(); alatBantu(p,m); };
  document.getElementById("bagi").onclick = ()=>{
    const nama = document.getElementById("daftar").value.split("\n").map(x=>x.trim()).filter(Boolean);
    const n = Number(document.getElementById("jml").value);
    const out = document.getElementById("hasilgrup");
    if(nama.length < n){ out.innerHTML = `<p class="catatan">Jumlah nama masih kurang dari jumlah kelompok.</p>`; return; }
    for(let i=nama.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [nama[i],nama[j]]=[nama[j],nama[i]]; }
    const kel = Array.from({length:n},()=>[]);
    nama.forEach((x,i)=>kel[i%n].push(x));
    out.innerHTML = `<div class="grup">${kel.map((k,i)=>`<div class="kel"><b>Kelompok ${i+1}</b>${k.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`).join("")}</div>`;
  };

  const jumlahMateri = Object.keys(S.gambar).length;
  const jumlahFoto = Object.values(S.gambar).reduce((a,b)=>a+b.length,0);
  const jumlahUbah = Object.keys(S.sunting).length;
  document.getElementById("ringkasgambar").textContent =
    `${jumlahFoto} gambar pada ${jumlahMateri} materi, dan ${jumlahUbah} materi yang isinya sudah disesuaikan. ` +
    `Status penyimpanan: ${CARA_SIMPAN==="perangkat"?"tersimpan di perangkat":"sementara di memori"}.`;

  const pesan = document.getElementById("pesangambar");
  document.getElementById("cadangkan").onclick = ()=>{
    if(jumlahFoto===0 && jumlahUbah===0){ pesan.textContent="Belum ada gambar atau penyesuaian untuk dicadangkan."; return; }
    unduhCadangan();
    pesan.textContent = "File cadangan diunduh, berisi gambar, video, dan seluruh penyesuaian modul.";
  };
  document.getElementById("pulihkan").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const data = JSON.parse(r.result);
        if(!data.gambar && !data.sunting) throw new Error("format");
        Object.entries(data.gambar||{}).forEach(([k,v])=>{ S.gambar[k] = (S.gambar[k]||[]).concat(v); });
        S.sunting = {...S.sunting, ...(data.sunting||{})};
        if(data.regu) S.regunama = data.regu;
        if(data.preset) S.preset = data.preset;
        await simpanData();
        alatBantu(p,m);
        document.getElementById("pesangambar").textContent = "Cadangan berhasil dipulihkan: gambar dan penyesuaian modul kembali.";
      }catch(err){ pesan.textContent = "File cadangan tidak dikenali. Pilih file cadangan dari aplikasi ini."; }
    };
    r.readAsText(f);
  };
  document.getElementById("simpannama").onclick = async ()=>{
    const n = document.getElementById("namaapp").value.trim();
    const sub = document.getElementById("subapp").value.trim();
    if(n.length<2){ document.getElementById("pesannama").textContent="Nama aplikasi minimal dua huruf."; return; }
    S.namaApp = n; S.subApp = sub; await simpanData(); pasangNamaApp();
    document.getElementById("pesannama").textContent = "Nama aplikasi tersimpan. Unduh ulang aplikasi siap dibagikan agar nama ini ikut terpakai di perangkat siswa.";
  };
  const pesanSrv = document.getElementById("pesanserver");
  document.getElementById("simpanserver").onclick = async ()=>{
    const v = document.getElementById("alamatserver").value.trim();
    if(v && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v)){
      pesanSrv.textContent = "Alamat harus berupa Web App Apps Script yang berakhiran /exec."; return;
    }
    S.server = v; await simpanData();
    pesanSrv.textContent = v ? "Alamat server tersimpan. Jangan lupa unduh ulang aplikasi siap dibagikan agar siswa memakai alamat ini."
                             : "Alamat server dikosongkan. Nilai hanya tersimpan di perangkat.";
  };
  document.getElementById("ujiserver").onclick = async ()=>{
    pesanSrv.textContent = "Menghubungi server...";
    const r = await ambilHasilServer();
    pesanSrv.textContent = r.ok ? `Terhubung. Ada ${r.jumlah} hasil kuis tersimpan di Spreadsheet.` : r.pesan;
  };
  document.getElementById("salinskrip").onclick = ()=>{
    navigator.clipboard.writeText(KODE_APPS_SCRIPT).then(
      ()=>pesanSrv.textContent="Kode Apps Script tersalin. Tempel di Extensions > Apps Script pada Spreadsheet-mu.",
      ()=>pesanSrv.textContent="Penyalinan gagal. Ketik ulang kodenya dari panduan.");
  };
  document.getElementById("eksporapp").onclick = ()=>{
    const kabar = document.getElementById("pesanekspor");
    try{
      const isiBawaan = JSON.stringify({gambar:S.gambar, video:S.video, sunting:S.sunting,
                                        regu:S.regunama, preset:S.preset, server:S.server,
                                        namaApp:S.namaApp, subApp:S.subApp}).replace(/<\//g,"<\\/");
      let sumber = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      sumber = sumber.replace(/(<main[^>]*id="isi"[^>]*>)[\s\S]*?(<\/main>)/, "$1$2");
      const penanda = "let BAWAAN = null; /*ISI-BAWAAN*/";
      if(sumber.indexOf(penanda) === -1){ kabar.textContent = "Penanda isi bawaan tidak ditemukan pada file ini."; return; }
      sumber = sumber.replace(penanda, "let BAWAAN = " + isiBawaan + "; /*ISI-BAWAAN*/");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([sumber],{type:"text/html"}));
      a.download = "ayo-gerak-siap-dibagikan.html";
      a.click(); URL.revokeObjectURL(a.href);
      const mb = (sumber.length/1048576).toFixed(1);
      kabar.textContent = `Aplikasi diunduh (sekitar ${mb} MB). File ini bisa langsung dibuka guru lain atau diunggah ke internet.`;
    }catch(e){ kabar.textContent = "Gagal membuat salinan aplikasi: " + e.message; }
  };
  document.getElementById("hapussunting").onclick = async ()=>{
    if(jumlahUbah===0){ pesan.textContent="Belum ada modul yang disesuaikan."; return; }
    if(!confirm(`Kembalikan ${jumlahUbah} materi ke isi bawaan aplikasi? Gambar tidak ikut terhapus.`)) return;
    S.sunting = {}; await simpanData(); alatBantu(p,m);
    document.getElementById("pesangambar").textContent = "Seluruh modul kembali ke isi bawaan.";
  };
  document.getElementById("hapussemua").onclick = async ()=>{
    if(jumlahFoto===0){ pesan.textContent="Belum ada gambar yang tersimpan."; return; }
    if(!confirm(`Hapus seluruh ${jumlahFoto} gambar peraga? Penyesuaian modul tidak ikut terhapus.`)) return;
    S.gambar = {}; await simpanData(); alatBantu(p,m);
    document.getElementById("pesangambar").textContent = "Semua gambar dihapus. Materi kembali memakai animasi.";
  };
}

muatData().then(()=>{ render(); kirimAntrian(); }, render);
</script>


</body></html>
