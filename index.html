<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayo Gerak — Ruang Belajar PJOK SD</title>
<meta name="theme-color" content="#0F4C42">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --lapangan:#0F4C42;
    --lapangan-tua:#0A322C;
    --kapur:#F3F6EF;
    --tenis:#D9EA4C;
    --lintasan:#E2542B;
    --abu:#5E6D68;
    --garis:rgba(15,76,66,.14);
    --display:"Arial Black","Arial Bold",Gadget,system-ui,sans-serif;
    --teks:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --aksen:var(--tenis);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--kapur);color:var(--lapangan-tua);font-family:var(--teks);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .bungkus{max-width:860px;margin:0 auto;padding:0 18px 96px}

  header.lapangan{
    background:var(--lapangan);
    background-image:repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.06) 39px 40px);
    color:#fff;padding:22px 0 18px;border-bottom:5px solid var(--aksen);transition:border-color .2s ease;
  }
  .kepala-isi{max-width:860px;margin:0 auto;padding:0 18px}
  .logo{display:flex;align-items:center;gap:11px}
  .peluit{width:34px;height:34px;border-radius:50%;background:var(--aksen);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--lapangan-tua);flex:none;transition:background .2s ease;overflow:hidden}
  .peluit.berlogo{background:#fff}
  .peluit img{width:100%;height:100%;object-fit:contain;display:block}
  .logo h1{font-family:var(--display);font-size:clamp(23px,6.4vw,31px);letter-spacing:-.03em;text-transform:uppercase;margin:0;line-height:1}
  .logo p{margin:3px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .peran{display:flex;gap:6px;margin-top:18px;background:rgba(0,0,0,.26);padding:5px;border-radius:999px}
  .peran button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.8);font-family:var(--teks);font-size:14px;font-weight:650;padding:9px 6px;border-radius:999px;cursor:pointer;transition:background .18s ease,color .18s ease}
  .peran button[aria-pressed="true"]{background:var(--aksen);color:var(--lapangan-tua)}
  .peran button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  body.mode-guru{--aksen:var(--lintasan)}

  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--abu);font-weight:700;margin:26px 0 10px}
  h2{font-family:var(--display);font-size:20px;letter-spacing:-.02em;margin:0 0 4px;text-transform:uppercase}
  h3{font-size:15.5px;margin:22px 0 8px;letter-spacing:-.01em}
  p{margin:0 0 10px}
  .catatan{color:var(--abu);font-size:14px}

  .cari{width:100%;padding:12px 14px;border:2px solid var(--garis);border-radius:12px;font-family:var(--teks);font-size:15px;background:#fff;margin-bottom:4px}
  .cari:focus{outline:2px solid var(--lapangan);outline-offset:1px}

  .kelas-baris{display:flex;gap:9px;flex-wrap:wrap}
  .nomor{width:56px;height:64px;border:2px solid var(--garis);background:#fff;border-radius:12px;cursor:pointer;font-family:var(--display);font-size:24px;color:var(--lapangan);display:grid;place-items:center;line-height:1;transition:transform .15s ease,border-color .15s ease,background .15s ease}
  .nomor small{display:block;font-family:var(--teks);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--abu);margin-top:4px}
  .nomor:hover{transform:translateY(-2px);border-color:var(--lapangan)}
  .nomor[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan)}
  .nomor[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
  .nomor:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}

  .fase{margin-top:14px;padding:12px 14px;background:#fff;border-radius:var(--radius);border-left:5px solid var(--aksen);font-size:14px}
  .fase b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--abu);margin-bottom:3px}

  .progres{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-top:14px}
  .progres .baris{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .progres b{font-family:var(--display);font-size:17px}
  .bar{height:9px;background:var(--garis);border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--aksen);border-radius:99px;transition:width .4s ease}

  .kartu{width:100%;text-align:left;border:0;background:#fff;cursor:pointer;border-radius:var(--radius);padding:15px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 0 var(--garis);transition:transform .15s ease,box-shadow .15s ease;font-family:var(--teks)}
  .kartu:hover{transform:translateX(3px);box-shadow:0 3px 14px rgba(15,76,66,.12)}
  .kartu:focus-visible{outline:2px solid var(--lapangan);outline-offset:2px}
  .jalur{width:6px;align-self:stretch;border-radius:99px;background:var(--aksen);flex:none}
  .kartu-teks{flex:1;min-width:0}
  .kartu .el{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--abu);font-weight:700}
  .kartu .jd{font-weight:700;font-size:16px;letter-spacing:-.01em;margin-top:2px}
  .lencana{font-size:11px;font-weight:700;color:var(--lapangan);background:#E7F5E1;border-radius:99px;padding:3px 9px;flex:none}
  .panah{font-size:19px;color:var(--lapangan);flex:none}

  .tab{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .tab button{border:2px solid var(--garis);background:#fff;color:var(--lapangan-tua);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:var(--teks);font-size:13.5px;font-weight:650}
  .tab button[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan)}
  .tab button:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}

  .panel{background:#fff;border-radius:var(--radius);padding:17px 17px 19px;animation:masuk .18s ease}
  @keyframes masuk{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  ul.rapi{margin:0;padding-left:19px}
  ul.rapi li{margin-bottom:7px}
  ol.langkah{list-style:none;counter-reset:l;margin:0;padding:0}
  ol.langkah li{counter-increment:l;position:relative;padding-left:40px;margin-bottom:13px}
  ol.langkah li::before{content:counter(l);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:var(--lapangan);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:13px}
  .main{border:2px dashed var(--garis);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .main b{display:block;margin-bottom:3px}

  /* ---------- panggung animasi ---------- */
  .panggung{
    background:#0F4C42;
    background-image:repeating-linear-gradient(90deg,transparent 0 29px,rgba(255,255,255,.07) 29px 30px);
    border-radius:var(--radius);padding:8px 8px 0;overflow:hidden;position:relative;
  }
  .panggung svg{display:block;width:100%;height:auto;max-height:250px}
  .keterangan{background:rgba(0,0,0,.28);color:#fff;font-size:13.5px;padding:9px 12px;margin:0 -8px;line-height:1.45}
  .kendali{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
  .kendali button{border:2px solid var(--garis);background:#fff;color:var(--lapangan-tua);font-family:var(--teks);font-weight:650;font-size:13.5px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .kendali button[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan)}
  .kendali button:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}
  .kendali .unggah{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--lapangan);background:#fff;color:var(--lapangan);font-family:var(--teks);font-weight:650;font-size:13.5px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .kendali .unggah input{display:none}
  .kendali a.unggah{text-decoration:none}
  .kendali .unggah:focus-within{outline:2px solid var(--lintasan);outline-offset:2px}
  .panggung img.foto{display:block;width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.2)}
  .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini button{border:2px solid var(--garis);background:#fff;border-radius:10px;padding:0;overflow:hidden;width:64px;height:52px;cursor:pointer}
  .mini button[aria-pressed="true"]{border-color:var(--lapangan)}
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .mini:focus-visible{outline:2px solid var(--lapangan)}
  .baris-soal{display:flex;justify-content:space-between;align-items:center}
  .sapa{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:var(--radius);padding:11px 14px;margin-top:18px;font-size:14.5px}
  .sapa button{border:2px solid var(--garis);background:#fff;color:var(--lapangan);font-family:var(--teks);font-weight:650;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;flex:none}
  .daftar-akun{margin-bottom:6px}
  .daftar-akun .kartu{margin-bottom:8px}
  .kunci input#namabaru,.kunci input#tautansiswa{letter-spacing:normal;text-align:left;font-size:15px}
  .isian input[readonly]{background:var(--kapur);font-size:13.5px}
  .bingkai{position:relative;width:100%;padding-top:56.25%;margin-top:10px;border-radius:10px;overflow:hidden;background:#000}
  .bingkai iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  video.video{width:100%;max-height:300px;border-radius:10px;background:#000;margin-top:10px;display:block}
  .kunci{max-width:360px;margin:26px auto 0;background:#fff;border-radius:var(--radius);padding:22px}
  .kunci h2{margin-bottom:8px}
  .kunci input{width:100%;padding:12px 14px;border:2px solid var(--garis);border-radius:11px;font-family:var(--teks);font-size:19px;letter-spacing:.3em;text-align:center;margin-bottom:10px;background:#fff}
  .kunci input:focus{outline:2px solid var(--lapangan);outline-offset:1px}
  .kunci .tombol{width:100%}
  .kunci .pesan{color:var(--lintasan);font-size:14px;min-height:20px;margin:8px 0 0}

  .figur line,.figur circle,.gulung line,.gulung circle{stroke:#fff;stroke-width:7;stroke-linecap:round;fill:none}
  .figur .kepala,.gulung .kepala{fill:var(--tenis);stroke:var(--tenis)}
  .bola{fill:var(--lintasan)}
  .alat{stroke:var(--tenis);stroke-width:7;stroke-linecap:round}
  .tanah{stroke:rgba(255,255,255,.45);stroke-width:3;stroke-dasharray:10 8}
  .gelembung{fill:rgba(217,234,76,.75)}
  .lgn{transform-box:view-box;transform-origin:100px 78px}
  .kk{transform-box:view-box;transform-origin:100px 115px}
  .figur,.gulung,.bola,.alat,.gelembung{transform-box:view-box}
  .figur{transform-origin:100px 160px}
  .gulung{transform-origin:100px 130px}

  @keyframes ayunA{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
  @keyframes ayunB{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
  @keyframes ayunKecilA{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
  @keyframes ayunKecilB{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  @keyframes putarPenuh{to{transform:rotate(360deg)}}
  @keyframes lompatFigur{0%,100%{transform:translateY(0)}18%{transform:translateY(10px)}45%{transform:translateY(-52px)}72%{transform:translateY(6px)}}
  @keyframes lenganAngkat{0%,100%{transform:rotate(20deg)}45%{transform:rotate(-115deg)}}
  @keyframes goyang{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes geserSamping{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
  @keyframes lenganNaik{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-70deg)}}
  @keyframes tendangKaki{0%,55%,100%{transform:rotate(0)}30%{transform:rotate(-60deg)}}
  @keyframes bolaTendang{0%,30%{transform:translate(0,0);opacity:1}75%{transform:translate(105px,-34px);opacity:1}90%,100%{transform:translate(120px,-10px);opacity:0}}
  @keyframes lemparLengan{0%{transform:rotate(150deg)}35%{transform:rotate(140deg)}60%{transform:rotate(-35deg)}100%{transform:rotate(150deg)}}
  @keyframes bolaLempar{0%,45%{transform:translate(0,0);opacity:1}80%{transform:translate(96px,-46px);opacity:1}95%,100%{transform:translate(120px,4px);opacity:0}}
  @keyframes squat{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
  @keyframes gulingMaju{0%{transform:translateX(-62px) rotate(0)}100%{transform:translateX(62px) rotate(360deg)}}
  @keyframes gulingMundur{0%{transform:translateX(62px) rotate(0)}100%{transform:translateX(-62px) rotate(-360deg)}}
  @keyframes bolaPantul{0%,100%{transform:translateY(0)}50%{transform:translateY(-58px)}}
  @keyframes bolaDribel{0%,100%{transform:translateY(-52px)}50%{transform:translateY(0)}}
  @keyframes pompaLengan{0%,100%{transform:rotate(28deg)}50%{transform:rotate(58deg)}}
  @keyframes ayunPemukul{0%,60%,100%{transform:rotate(-55deg)}80%{transform:rotate(70deg)}}
  @keyframes bolaPukul{0%,78%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(-120px,-40px);opacity:0}}
  @keyframes gosokKi{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(8deg)}}
  @keyframes gosokKa{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-8deg)}}
  @keyframes naikHilang{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-52px);opacity:0}}
  @keyframes larikanan{from{transform:translateX(-70px)}to{transform:translateX(20px)}}
  @keyframes tongkatPindah{0%,40%{transform:translate(-52px,0)}70%,100%{transform:translate(34px,0)}}

  svg.gerak{--spd:1}
  svg.gerak.lambat{--spd:2.1}
  svg.gerak.jeda *{animation-play-state:paused!important}

  .a-lari .lgn-ka,.a-lari .kk-ki{animation:ayunA calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-lari .lgn-ki,.a-lari .kk-ka{animation:ayunB calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-lari .figur{animation:bob calc(var(--spd)*.21s) infinite alternate ease-in-out}
  .a-jalan .lgn-ka,.a-jalan .kk-ki{animation:ayunKecilA calc(var(--spd)*.8s) infinite alternate ease-in-out}
  .a-jalan .lgn-ki,.a-jalan .kk-ka{animation:ayunKecilB calc(var(--spd)*.8s) infinite alternate ease-in-out}
  .a-putar .lgn-ki,.a-putar .lgn-ka{animation:putarPenuh calc(var(--spd)*1.7s) linear infinite}
  .a-lompat .figur{animation:lompatFigur calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-lompat .lgn-ki,.a-lompat .lgn-ka{animation:lenganAngkat calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-imbang .kk-ka{transform:rotate(38deg)}
  .a-imbang .lgn-ki{transform:rotate(-72deg)}
  .a-imbang .lgn-ka{transform:rotate(72deg)}
  .a-imbang .figur{animation:goyang calc(var(--spd)*2.4s) infinite ease-in-out}
  .a-ritmik .figur{animation:geserSamping calc(var(--spd)*1.1s) infinite alternate ease-in-out}
  .a-ritmik .lgn-ki{animation:lenganNaik calc(var(--spd)*1.1s) infinite ease-in-out}
  .a-ritmik .lgn-ka{animation:lenganNaik calc(var(--spd)*1.1s) infinite ease-in-out reverse}
  .a-tendang .kk-ka{animation:tendangKaki calc(var(--spd)*1.7s) infinite ease-in-out}
  .a-tendang .bola{animation:bolaTendang calc(var(--spd)*1.7s) infinite ease-out}
  .a-tendang .lgn-ki{transform:rotate(-24deg)}
  .a-lempar .lgn-ka{animation:lemparLengan calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-lempar .bola{animation:bolaLempar calc(var(--spd)*1.9s) infinite ease-out}
  .a-kuat .figur{animation:squat calc(var(--spd)*1.6s) infinite ease-in-out}
  .a-kuat .lgn-ki{transform:rotate(-84deg)}
  .a-kuat .lgn-ka{transform:rotate(84deg)}
  .a-guling .gulung{animation:gulingMaju calc(var(--spd)*2.2s) infinite linear}
  .a-guling-mundur .gulung{animation:gulingMundur calc(var(--spd)*2.2s) infinite linear}
  .a-passing .figur{animation:squat calc(var(--spd)*1.5s) infinite ease-in-out}
  .a-passing .lgn-ki{transform:rotate(-44deg)}
  .a-passing .lgn-ka{transform:rotate(44deg)}
  .a-passing .bola{animation:bolaPantul calc(var(--spd)*1.5s) infinite ease-in-out}
  .a-dribel .bola{animation:bolaDribel calc(var(--spd)*.72s) infinite ease-in-out}
  .a-dribel .lgn-ka{animation:pompaLengan calc(var(--spd)*.72s) infinite ease-in-out}
  .a-pukul .alat-pukul{animation:ayunPemukul calc(var(--spd)*2s) infinite ease-in-out}
  .a-pukul .bola{animation:bolaPukul calc(var(--spd)*2s) infinite ease-out}
  .a-pukul .lgn-ki,.a-pukul .lgn-ka{transform:rotate(-40deg)}
  .a-sehat .lgn-ki{animation:gosokKi calc(var(--spd)*.6s) infinite ease-in-out;transform-origin:100px 78px}
  .a-sehat .lgn-ka{animation:gosokKa calc(var(--spd)*.6s) infinite ease-in-out;transform-origin:100px 78px}
  .a-sehat .gelembung{animation:naikHilang calc(var(--spd)*2s) infinite ease-out}
  .a-sehat .g2{animation-delay:.6s}
  .a-sehat .g3{animation-delay:1.2s}
  .a-estafet .lgn-ka,.a-estafet .kk-ki{animation:ayunA calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-estafet .lgn-ki,.a-estafet .kk-ka{animation:ayunB calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-estafet .tongkat{animation:tongkatPindah calc(var(--spd)*2.6s) infinite ease-in-out}

  .soal{margin-bottom:22px}
  .soal .no{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--abu);font-weight:700}
  .soal .tanya{font-weight:650;margin:4px 0 10px}
  .pilihan{display:block;width:100%;text-align:left;margin-bottom:8px;border:2px solid var(--garis);background:#fff;border-radius:11px;padding:11px 13px;cursor:pointer;font-family:var(--teks);font-size:15px;color:var(--lapangan-tua)}
  .pilihan:hover:not(:disabled){border-color:var(--lapangan)}
  .pilihan:disabled{cursor:default}
  .pilihan.benar{background:#E7F5E1;border-color:#3F8F42;font-weight:650}
  .pilihan.dipilih{background:var(--lapangan);color:#fff;border-color:var(--lapangan);font-weight:650}
  .pilihan.salah{background:#FDECE7;border-color:var(--lintasan)}
  .pilihan:focus-visible{outline:2px solid var(--lapangan);outline-offset:2px}
  .bahas{font-size:14px;background:var(--kapur);border-radius:10px;padding:10px 12px;margin-top:2px}
  .skor{background:var(--lapangan);color:#fff;border-radius:var(--radius);padding:16px;text-align:center;margin-top:6px}
  .skor .angka{font-family:var(--display);font-size:38px;line-height:1}
  .skor p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:14px}

  .isian{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .isian input,.isian select{flex:1;min-width:150px;padding:11px 13px;border:2px solid var(--garis);border-radius:11px;font-family:var(--teks);font-size:15px;background:#fff}
  .isian input:focus,.isian select:focus{outline:2px solid var(--lapangan);outline-offset:1px}
  textarea{width:100%;min-height:96px;padding:11px 13px;border:2px solid var(--garis);border-radius:11px;font-family:var(--teks);font-size:15px;background:#fff;resize:vertical}
  textarea:focus{outline:2px solid var(--lapangan);outline-offset:1px}
  .tombol{border:0;background:var(--lapangan);color:#fff;font-family:var(--teks);font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:11px;cursor:pointer}
  .tombol.garis{background:#fff;color:var(--lapangan);border:2px solid var(--lapangan)}
  .tombol:focus-visible{outline:2px solid var(--lintasan);outline-offset:2px}
  .gulir{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -17px;padding:0 17px}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:430px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--garis);text-align:left}
  th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--abu);font-weight:700;vertical-align:bottom}

 {j:"Gerak Melompat dan Meloncat",e:"Kombinasi gerak lokomotor",a:"lompat",ak:"Tekuk lutut sebelum menolak, ayunkan lengan ke atas, lalu mendarat dengan lutut mengeper.",
  t:["Membedakan gerak melompat dan meloncat.","Mempraktikkan tolakan dan pendaratan yang aman.","Berani mencoba tanpa takut salah."],
  l:["Melompat memakai tolakan satu kaki, meloncat memakai tolakan dua kaki.","Tekuk lutut sedikit sebelum menolak.","Ayunkan kedua lengan ke atas saat menolak.","Mendarat dengan ujung kaki lalu tumit, lutut mengeper.","Berlatih melewati tali rendah dan lingkaran simpai."],
  p:[{n:"Katak Melompat",d:"Siswa meloncat dari satu simpai ke simpai lain dengan dua kaki tanpa menginjak garis."},
     {n:"Lompat Tali Rendah",d:"Tali dipasang setinggi 20 cm. Siswa melompat bergantian, tinggi tali ditambah bertahap."}],
  k:[{s:"Meloncat dilakukan dengan tolakan...",o:["Satu kaki","Dua kaki","Tangan"],a:1,x:"Meloncat memakai dua kaki, melompat memakai satu kaki."},
     {s:"Agar pendaratan aman, lutut harus...",o:["Lurus kaku","Mengeper","Disilang"],a:1,x:"Lutut mengeper menyerap benturan saat mendarat."},
     {s:"Gerakan lengan saat menolak adalah...",o:["Diayun ke atas","Dilipat di dada","Dimasukkan saku"],a:0,x:"Ayunan lengan ke atas menambah daya tolak."}],
  g:{alat:["Simpai","Tali karet","Matras atau bak pasir","Peluit"],
     pe:"Berbaris, berdoa, pemanasan permainan Katak Melompat (10 menit).",
     in:"Guru menjelaskan beda lompat dan loncat, siswa berlatih tolakan satu dan dua kaki, lalu melewati rintangan tali bertahap (35 menit).",
     pu:"Pendinginan peregangan tungkai, refleksi keberanian, doa (10 menit).",
     r:["Ketepatan tolakan","Keamanan pendaratan","Keberanian mencoba"]}},

 {j:"Keseimbangan dan Bertumpu",e:"Aktivitas senam",a:"imbang",ak:"Bertumpu pada satu kaki, kedua lengan direntangkan, pandangan fokus pada satu titik di depan.",
  t:["Mempraktikkan sikap keseimbangan berdiri satu kaki.","Mempraktikkan tumpuan tangan dengan aman.","Menjaga keselamatan diri dan teman saat beraktivitas."],
  l:["Berdiri satu kaki, kaki lain ditekuk ke belakang, tangan direntangkan.","Tahan sikap kapal terbang selama 5 hitungan.","Berjalan mengikuti garis lurus dengan tumit-ujung kaki.","Posisi merangkak, pindahkan berat badan ke kedua tangan.","Sikap lilin dengan bantuan matras dan pengawasan guru."],
  p:[{n:"Patung Berdiri",d:"Saat musik berhenti, siswa menahan sikap berdiri satu kaki. Yang goyah bergabung menjadi juri."},
     {n:"Titian Garis",d:"Siswa berjalan di atas garis lurus sambil membawa buku di kepala."}],
  k:[{s:"Sikap kapal terbang bertumpu pada...",o:["Dua kaki","Satu kaki","Dua tangan"],a:1,x:"Kapal terbang adalah keseimbangan bertumpu satu kaki."},
     {s:"Alas yang dipakai saat latihan bertumpu tangan sebaiknya...",o:["Matras","Lantai keras","Batu"],a:0,x:"Matras melindungi tubuh apabila terjatuh."},
     {s:"Agar tubuh tetap seimbang, pandangan diarahkan ke...",o:["Satu titik di depan","Belakang","Bawah kaki"],a:0,x:"Fokus pada satu titik membantu tubuh stabil."}],
  g:{alat:["Matras","Garis lurus dari lakban/kapur","Buku tipis","Peluit"],
     pe:"Berbaris, berdoa, pemanasan peregangan statis (10 menit).",
     in:"Latihan keseimbangan berdiri satu kaki, titian garis, dan tumpuan tangan di matras secara bergantian per pos (35 menit).",
     pu:"Pendinginan, tanya jawab pos yang paling menantang, doa (10 menit).",
     r:["Kestabilan sikap keseimbangan","Keamanan saat bertumpu","Kepatuhan pada aturan pos"]}},

 {j:"Gerak Berirama Sederhana",e:"Aktivitas gerak berirama",a:"ritmik",ak:"Langkah ke samping dan ayunan lengan mengikuti hitungan 1 sampai 8 dengan tempo tetap.",
  t:["Mempraktikkan gerak langkah dan ayunan mengikuti irama.","Menyelaraskan gerak dengan hitungan atau musik.","Percaya diri tampil bersama kelompok."],
  l:["Langkah biasa ke depan 4 hitungan, kembali 4 hitungan.","Tambahkan ayunan lengan searah langkah.","Langkah ke samping kanan dan kiri dengan tepukan.","Gabungkan langkah dan ayunan menjadi rangkaian 2x8 hitungan.","Tampilkan rangkaian bersama kelompok mengikuti musik."],
  p:[{n:"Ikuti Pemimpin",d:"Satu siswa menjadi pemimpin gerak, yang lain menirukan sampai musik berganti."},
     {n:"Senam Tepuk",d:"Guru menepuk pola irama, siswa membalas dengan gerak langkah sesuai jumlah tepukan."}],
  k:[{s:"Gerak berirama dilakukan mengikuti...",o:["Irama atau hitungan","Arah angin","Kecepatan teman"],a:0,x:"Irama menjadi patokan agar gerak seragam."},
     {s:"Satu rangkaian gerak berirama biasanya dihitung...",o:["1 sampai 3","1 sampai 8","1 sampai 20"],a:1,x:"Hitungan 1–8 adalah patokan umum dalam gerak berirama."},
     {s:"Saat tampil berkelompok, sikap yang diperlukan adalah...",o:["Kompak","Saling mendahului","Diam saja"],a:0,x:"Kekompakan membuat penampilan kelompok rapi."}],
  g:{alat:["Pemutar musik","Peluit","Ruang terbuka atau aula"],
     pe:"Berbaris berbanjar, berdoa, pemanasan mengikuti musik ceria (10 menit).",
     in:"Guru mengajarkan langkah dan ayunan per 8 hitungan, siswa berlatih kelompok lalu tampil bergantian (35 menit).",
     pu:"Pendinginan mengikuti musik lambat, apresiasi penampilan, doa (10 menit).",
     r:["Keselarasan gerak dengan irama","Kekompakan kelompok","Kepercayaan diri saat tampil"]}},
 {j:"Menendang dan Menggiring Bola Sederhana",e:"Keterampilan gerak manipulatif",a:"tendang",ak:"Bola didorong dengan kaki bagian dalam, sentuhan pelan supaya bola tetap dekat dengan kaki.",
  t:["Mempraktikkan menendang bola dengan kaki bagian dalam.","Mempraktikkan menggiring bola lurus dan berbelok.","Bermain bergantian dengan tertib."],
  l:["Letakkan kaki tumpu di samping bola, pandangan ke depan.","Dorong bola pelan dengan kaki bagian dalam.","Giring bola lurus sejauh 5 meter dengan sentuhan pelan.","Giring bola melewati dua kerucut secara berkelok.","Tendang bola ke arah gawang kecil dari jarak 3 meter."],
  p:[{n:"Giring dan Kembali",d:"Siswa menggiring bola melewati kerucut lalu kembali ke barisan dan menyerahkan bola ke teman berikutnya."},
     {n:"Gawang Kerucut",d:"Dua kerucut dijadikan gawang. Siswa bergantian menendang bola agar melewati gawang dari jarak 3 meter."}],
  k:[{s:"Menggiring bola dilakukan dengan sentuhan...",o:["Pelan dan sering","Sekuat tenaga","Satu kali saja"],a:0,x:"Sentuhan pelan membuat bola tetap dekat dan mudah dikuasai."},
     {s:"Bagian kaki yang dipakai menendang bola untuk pemula adalah...",o:["Kaki bagian dalam","Tumit","Ujung jari"],a:0,x:"Kaki bagian dalam punya bidang lebar sehingga arah bola lebih terkontrol."},
     {s:"Saat menggiring bola, pandangan sebaiknya...",o:["Ke depan dan sesekali ke bola","Terus ke bawah","Ke belakang"],a:0,x:"Pandangan ke depan membantu melihat arah dan menghindari tabrakan."}],
  g:{alat:["Bola plastik ringan","Kerucut atau botol air","Peluit"],
     pe:"Berbaris, berdoa, pemanasan lari kecil dan gerakan pergelangan kaki (10 menit).",
     in:"Latihan menendang berpasangan jarak dekat, latihan menggiring lurus dan berkelok, permainan Gawang Kerucut (35 menit).",
     pu:"Pendinginan, refleksi kesulitan menggiring, doa (10 menit).",
     r:["Teknik menendang kaki bagian dalam","Kontrol saat menggiring","Ketertiban menunggu giliran"]}},

 {j:"Berlari dan Berbelok",e:"Kombinasi gerak lokomotor",a:"lari",ak:"Perlambat sedikit sebelum berbelok, condongkan badan ke arah belokan agar tidak terpeleset.",
  t:["Mempraktikkan lari lurus dan lari berbelok.","Mengubah arah lari dengan aman.","Menjaga keselamatan diri dan teman saat berlari."],
  l:["Lari pelan lurus sejauh 10 meter.","Perlambat langkah sedikit sebelum berbelok.","Condongkan badan ke arah belokan.","Lari melewati kerucut membentuk lintasan zig-zag.","Lari mengelilingi lingkaran besar sambil menjaga jarak dengan teman."],
  p:[{n:"Zig-zag Kerucut",d:"Siswa berlari melewati lima kerucut secara berkelok, kelompok tercepat tanpa menyenggol kerucut menang."},
     {n:"Kejar Bayangan",d:"Berpasangan, satu berlari bebas berbelok-belok dan satu mengikuti dari jarak dua langkah."}],
  k:[{s:"Sebelum berbelok saat berlari, sebaiknya...",o:["Perlambat sedikit","Percepat lari","Melompat"],a:0,x:"Melambat sedikit membuat belokan terkendali dan tidak terpeleset."},
     {s:"Agar tidak bertabrakan saat berlari bersama, kita perlu...",o:["Menjaga jarak","Berlari rapat","Menutup mata"],a:0,x:"Menjaga jarak mencegah tabrakan antarteman."},
     {s:"Saat berbelok, badan dicondongkan ke...",o:["Arah belokan","Arah berlawanan","Belakang"],a:0,x:"Condong ke arah belokan menjaga keseimbangan tubuh."}],
  g:{alat:["Kerucut atau botol bekas","Peluit","Lapangan atau halaman sekolah"],
     pe:"Berbaris, berdoa, pemanasan jalan cepat dan lari kecil (10 menit).",
     in:"Latihan lari lurus, latihan berbelok satu arah, lintasan zig-zag, dilanjutkan permainan Kejar Bayangan (35 menit).",
     pu:"Pendinginan, tanya jawab cara berlari yang aman, doa (10 menit).",
     r:["Teknik lari","Keamanan saat berbelok","Kepatuhan pada aturan permainan"]}},

 {j:"Makanan Sehat dan Jajanan Aman",e:"Pola hidup sehat",a:"sehat",ak:"Cuci tangan sebelum makan dan pilih jajanan yang tertutup serta bersih.",
  t:["Membedakan makanan sehat dan tidak sehat.","Menyebutkan ciri jajanan yang aman.","Membiasakan sarapan sebelum berangkat sekolah."],
  l:["Kenali makanan sehat: nasi, sayur, lauk, buah, dan susu.","Kenali jajanan yang perlu dihindari: terlalu manis, berwarna mencolok, dan terbuka.","Perhatikan kebersihan tempat jajan dan penjualnya.","Cuci tangan dengan sabun sebelum makan.","Biasakan sarapan setiap pagi sebelum berangkat sekolah."],
  p:[{n:"Pilih Piringku",d:"Siswa menempel gambar makanan pada piring kertas sesuai kelompok makanan sehat."},
     {n:"Sehat atau Tidak",d:"Guru menyebut nama makanan, siswa mengangkat tangan bila sehat dan menyilangkan tangan bila tidak."}],
  k:[{s:"Contoh makanan sehat adalah...",o:["Sayur dan buah","Permen warna-warni","Minuman bersoda"],a:0,x:"Sayur dan buah kaya vitamin dan serat untuk tubuh."},
     {s:"Jajanan yang aman biasanya...",o:["Tertutup dan bersih","Terbuka di pinggir jalan","Berwarna sangat mencolok"],a:0,x:"Makanan tertutup terlindung dari debu dan lalat."},
     {s:"Sarapan sebaiknya dilakukan...",o:["Setiap pagi","Kalau ingat saja","Tidak perlu"],a:0,x:"Sarapan memberi tenaga untuk belajar dan bergerak."}],
  g:{alat:["Gambar makanan atau kemasan bekas","Piring kertas","Lem dan gunting","Kartu pertanyaan"],
     pe:"Berbaris, berdoa, tanya jawab sarapan siswa pagi ini (10 menit).",
     in:"Penjelasan makanan sehat, permainan Sehat atau Tidak, dilanjutkan membuat Pilih Piringku berkelompok (35 menit).",
     pu:"Menyimpulkan ciri jajanan aman, menempel hasil karya di kelas, doa (10 menit).",
     r:["Pemahaman makanan sehat","Ketepatan memilih jajanan aman","Keaktifan dalam kelompok"]}},
 {j:"Memukul dan Memantulkan Bola",e:"Keterampilan gerak manipulatif",a:"dribel",sem:1,ak:"Bola dipantulkan dengan dorongan ujung jari, dan dipukul dengan ayunan lengan yang rileks.",
  ml:"Pengertian\nMemukul dan memantulkan bola adalah gerak manipulatif yang melatih penguasaan bola dengan tangan. Memantulkan berarti mendorong bola ke lantai berulang kali.\n\nManfaat\nMelatih koordinasi mata dan tangan, kepekaan mengukur tenaga, serta menjadi dasar permainan bola basket dan bola voli.\n\nHal yang perlu diperhatikan\nBola didorong dengan ujung jari, bukan ditepuk telapak tangan. Gunakan bola plastik ringan agar tangan siswa tidak sakit.",
  t:["Mempraktikkan memantulkan bola di tempat.","Mempraktikkan memukul bola ke arah sasaran.","Menjaga giliran dan tertib saat berlatih."],
  l:["Berdiri dengan lutut sedikit ditekuk, bola dipegang dua tangan.","Pantulkan bola ke lantai dengan dorongan ujung jari.","Pantulkan bola sepuluh kali di tempat tanpa berpindah.","Untuk memukul, lambungkan bola sedikit lalu pukul dengan telapak tangan.","Arahkan pukulan ke dinding atau sasaran di lantai."],
  p:[{n:"Pantul Hitung",d:"Siswa memantulkan bola sambil menghitung, yang bolanya lepas mengulang dari awal."},
     {n:"Pukul Sasaran Dinding",d:"Siswa memukul bola ke arah lingkaran yang digambar di dinding dari jarak dua meter."}],
  k:[{s:"Memantulkan bola dilakukan dengan...",o:["Dorongan ujung jari","Tepukan telapak","Pukulan kepalan"],a:0,x:"Dorongan ujung jari membuat pantulan lebih terkendali."},
     {s:"Agar bola tidak lepas, pandangan sebaiknya ke...",o:["Depan dan sesekali ke bola","Terus ke langit","Ke belakang"],a:0,x:"Pandangan ke depan melatih siswa menguasai bola tanpa selalu menunduk."},
     {s:"Bola yang cocok untuk latihan pemula adalah...",o:["Bola plastik ringan","Bola besi","Bola sangat keras"],a:0,x:"Bola ringan membuat siswa berani berlatih dan tangan tidak sakit."}],
  g:{alat:["Bola plastik ringan","Kapur untuk sasaran","Peluit"],
     pe:"Berbaris, berdoa, pemanasan pergelangan tangan dan bahu (10 menit).",
     in:"Latihan memantulkan bola di tempat, memantulkan sambil berjalan, latihan memukul ke sasaran dinding (35 menit).",
     pu:"Pendinginan, refleksi jumlah pantulan terbanyak, doa (10 menit).",
     r:["Penguasaan memantulkan bola","Ketepatan memukul sasaran","Ketertiban menunggu giliran"]}},

 {j:"Kebugaran Sederhana: Kuat dan Lentur",e:"Kebugaran jasmani",a:"kuat",sem:2,ak:"Turun perlahan sampai lutut menekuk, punggung tetap tegak, lalu naik dengan tenaga tungkai.",
  ml:"Pengertian\nKebugaran jasmani adalah kemampuan tubuh melakukan kegiatan sehari-hari tanpa kelelahan berlebihan. Di kelas dua, unsur yang dilatih adalah kekuatan sederhana dan kelentukan.\n\nManfaat\nMembuat tubuh lebih kuat, tidak mudah cedera, dan membantu anak duduk serta berjalan dengan postur yang baik.\n\nHal yang perlu diperhatikan\nLatihan berbentuk permainan agar menyenangkan. Jumlah ulangan disesuaikan kemampuan, dan peregangan dilakukan perlahan tanpa menghentak.",
  t:["Mempraktikkan latihan kekuatan sederhana.","Mempraktikkan latihan kelentukan tubuh.","Menyebutkan manfaat tubuh yang bugar."],
  l:["Jongkok berdiri sepuluh kali dengan punggung tegak.","Push up dinding sepuluh kali dengan lengan menekuk perlahan.","Duduk selonjor lalu raih ujung kaki, tahan 8 hitungan.","Berbaring telentang, tarik lutut ke dada, tahan 8 hitungan.","Ulangi rangkaian sebanyak dua putaran dengan istirahat pendek."],
  p:[{n:"Sirkuit Tiga Pos",d:"Tiga pos berisi jongkok berdiri, push up dinding, dan peregangan, masing-masing 30 detik."},
     {n:"Tirukan Hewan",d:"Siswa berjalan meniru beruang, katak, dan kepiting untuk melatih kekuatan sambil bermain."}],
  k:[{s:"Latihan jongkok berdiri melatih kekuatan otot...",o:["Tungkai","Leher","Jari tangan"],a:0,x:"Gerakan jongkok berdiri melatih otot paha dan tungkai."},
     {s:"Kelentukan tubuh dilatih dengan...",o:["Peregangan","Lari cepat","Melompat tinggi"],a:0,x:"Peregangan meningkatkan kelentukan otot dan sendi."},
     {s:"Tubuh yang bugar membuat kita...",o:["Tidak mudah lelah","Cepat mengantuk","Malas bergerak"],a:0,x:"Kebugaran membuat tubuh bertenaga untuk belajar dan bermain."}],
  g:{alat:["Matras atau tikar","Stopwatch","Kartu pos latihan","Peluit"],
     pe:"Berbaris, berdoa, pemanasan permainan Tirukan Hewan (10 menit).",
     in:"Penjelasan tiap pos, pelaksanaan Sirkuit Tiga Pos dua putaran, latihan peregangan bersama (35 menit).",
     pu:"Pendinginan, mencatat jumlah ulangan, doa (10 menit).",
     r:["Kebenaran gerak latihan","Kesungguhan mengikuti sirkuit","Pemahaman manfaat kebugaran"]}}
],

3:[
 {j:"Permainan Bola Kecil: Kasti",e:"Permainan invasi dan lapangan",a:"pukul",ak:"Badan menyamping arah bola, pemukul diayun mendatar, pandangan mengikuti bola sampai kena.",
  t:["Mempraktikkan lemparan dan tangkapan bola kecil.","Mempraktikkan pukulan bola menggunakan pemukul.","Menerapkan aturan permainan kasti sederhana."],
  l:["Pegang bola kasti dengan tiga jari, lengan ditarik ke belakang.","Lempar bola melambung ke arah pemukul.","Pemukul berdiri menyamping, kedua tangan memegang pemukul di bahu.","Ayunkan pemukul mendatar mengenai bola, pandangan ke bola.","Setelah memukul, lari menuju tiang hinggap pertama."],
  p:[{n:"Kasti Mini",d:"Dimainkan 5 lawan 5 dengan dua tiang hinggap dan lapangan kecil."},
     {n:"Lempar Tangkap Berpasangan",d:"Berpasangan melempar bola melambung dan mendatar bergantian selama 2 menit."}],
  k:[{s:"Regu yang bertugas melempar bola kepada pemukul disebut...",o:["Regu pemukul","Regu penjaga","Wasit"],a:1,x:"Regu penjaga bertugas melambungkan dan menangkap bola."},
     {s:"Saat memukul, posisi badan menghadap...",o:["Menyamping arah bola","Membelakangi bola","Ke bawah"],a:0,x:"Posisi menyamping memberi ruang ayunan pemukul."},
     {s:"Pemain yang berhasil kembali ke ruang bebas memperoleh...",o:["Nilai","Peringatan","Kartu merah"],a:0,x:"Kembali ke ruang bebas dengan selamat menghasilkan nilai."}],
  g:{alat:["Bola kasti","Pemukul kayu","Tiang hinggap/kerucut","Peluit"],
     pe:"Berbaris, berdoa, pemanasan lari keliling lapangan dan peregangan dinamis (10 menit).",
     in:"Latihan lempar-tangkap berpasangan, latihan memukul bergantian, lalu bermain Kasti Mini dengan aturan sederhana (55 menit).",
     pu:"Pendinginan, evaluasi permainan dan sportivitas, doa (10 menit).",
     r:["Teknik melempar dan menangkap","Ketepatan memukul bola","Penerapan aturan dan sportivitas"]}},

 {j:"Kebugaran Jasmani: Kekuatan dan Kelenturan",e:"Kebugaran jasmani",a:"kuat",ak:"Turun perlahan sampai lutut menekuk, punggung tetap tegak, lalu naik kembali dengan tenaga tungkai.",
  t:["Mempraktikkan latihan kekuatan otot lengan dan tungkai.","Mempraktikkan latihan kelenturan tubuh.","Menjelaskan manfaat latihan kebugaran bagi kesehatan."],
  l:["Push up dinding 10 kali untuk kekuatan lengan.","Squat 10 kali dengan punggung tegak.","Sit up berpasangan 10 kali, kaki dipegang teman.","Cium lutut dalam posisi duduk selama 8 hitungan.","Putar pinggang perlahan ke kanan dan kiri 8 hitungan."],
  p:[{n:"Sirkuit 4 Pos",d:"Tiap pos berisi satu latihan selama 30 detik, siswa berpindah searah jarum jam."},
     {n:"Tarik Tambang Kelompok",d:"Dua kelompok saling menarik tali untuk melatih kekuatan lengan dan tungkai."}],
  k:[{s:"Latihan yang melatih kekuatan otot tungkai adalah...",o:["Squat","Cium lutut","Memutar leher"],a:0,x:"Squat melatih otot paha dan tungkai."},
     {s:"Kelenturan tubuh dilatih dengan gerakan...",o:["Peregangan","Berlari cepat","Melompat tinggi"],a:0,x:"Peregangan meningkatkan kelenturan otot dan sendi."},
     {s:"Manfaat kebugaran jasmani adalah...",o:["Tubuh cepat lelah","Tidak mudah sakit","Malas belajar"],a:1,x:"Tubuh bugar membuat daya tahan tubuh lebih baik."}],
  g:{alat:["Matras","Stopwatch","Tali tambang","Kartu pos latihan"],
     pe:"Berbaris, berdoa, pemanasan jogging ringan 5 menit dan peregangan (10 menit).",
     in:"Penjelasan tiap pos, pelaksanaan sirkuit 4 pos dua putaran, dilanjutkan tarik tambang (55 menit).",
     pu:"Pendinginan, mencatat jumlah ulangan pada kartu pos, doa (10 menit).",
     r:["Kebenaran gerak latihan","Jumlah ulangan yang dicapai","Kedisiplinan mengikuti sirkuit"]}},

 {j:"Senam Lantai: Guling Depan",e:"Aktivitas senam",a:"guling",ak:"Dagu rapat ke dada dan badan membulat sehingga gulingan berjalan mulus dari tengkuk ke punggung.",
  t:["Mempraktikkan tahapan guling depan dengan aman.","Menjaga posisi tubuh membulat saat berguling.","Membantu teman menjaga keselamatan saat berlatih."],
  l:["Jongkok di ujung matras, kedua telapak tangan menempel di matras.","Masukkan dagu ke dada, tengkuk menyentuh matras lebih dulu.","Dorong panggul ke depan, badan membulat.","Berguling hingga punggung menyentuh matras berurutan.","Akhiri dengan posisi jongkok, kedua lengan lurus ke depan."],

 {j:"Permainan Tradisional: Gobak Sodor",e:"Permainan tradisional",a:"lari",sem:1,ak:"Penjaga bergerak menyamping di garisnya, penyerang menunggu celah lalu menerobos dengan cepat.",
  ml:"Pengertian\nGobak sodor atau hadang adalah permainan tradisional beregu. Regu penjaga berdiri di garis melintang, regu penyerang berusaha menerobos sampai garis terakhir dan kembali tanpa tersentuh.\n\nManfaat\nMelatih kelincahan, kecepatan, kerja sama, pengambilan keputusan cepat, sekaligus melestarikan permainan tradisional Indonesia.\n\nHal yang perlu diperhatikan\nSentuhan dilakukan dengan telapak tangan terbuka, bukan menarik baju atau mendorong. Lapangan digambar dengan kapur dan permukaannya harus rata.",
  t:["Menerapkan gerak lari dan menghindar dalam permainan tradisional.","Bekerja sama dengan regu untuk menjaga dan menyerang.","Menghargai permainan tradisional daerah."],
  l:["Buat lapangan persegi panjang dengan 3 sampai 4 garis melintang.","Regu penjaga berdiri di garis, hanya boleh bergerak menyamping di garisnya.","Regu penyerang berusaha melewati semua garis tanpa tersentuh.","Bila tersentuh, regu bertukar posisi menjadi penjaga.","Regu penyerang menang bila berhasil kembali ke garis awal."],
  p:[{n:"Gobak Sodor Mini",d:"Dimainkan 4 lawan 4 dengan tiga garis saja agar semua siswa cepat mendapat giliran."},
     {n:"Hadang Berpasangan",d:"Latihan menghindar berpasangan: satu menjaga garis, satu berusaha melewatinya."}],
  k:[{s:"Regu penjaga dalam gobak sodor hanya boleh bergerak...",o:["Menyamping di garisnya","Ke mana saja","Keluar lapangan"],a:0,x:"Penjaga terikat pada garisnya dan hanya bergerak menyamping."},
     {s:"Cara menyentuh lawan yang benar adalah...",o:["Telapak tangan terbuka","Menarik baju","Mendorong keras"],a:0,x:"Sentuhan telapak terbuka menjaga permainan tetap aman dan sportif."},
     {s:"Gobak sodor termasuk permainan...",o:["Tradisional Indonesia","Modern dari luar negeri","Individu"],a:0,x:"Gobak sodor adalah permainan tradisional beregu asal Indonesia."}],
  g:{alat:["Kapur atau lakban untuk garis","Peluit","Rompi pembeda"],
     pe:"Berbaris, berdoa, pemanasan lari kecil dan gerakan menyamping (10 menit).",
     in:"Penjelasan aturan, latihan menghindar berpasangan, dilanjutkan Gobak Sodor Mini bergantian antarregu (55 menit).",
     pu:"Pendinginan, evaluasi strategi dan sportivitas, doa (10 menit).",
     r:["Kelincahan menghindar dan menjaga","Kerja sama regu","Sportivitas dan penerapan aturan"]}},

 {j:"Pola Hidup Sehat: Istirahat dan Tidur Cukup",e:"Pola hidup sehat",a:"sehat",sem:2,ak:"Tidur cukup 9 sampai 11 jam membuat tubuh pulih dan siap bergerak esok hari.",
  ml:"Pengertian\nIstirahat adalah waktu tubuh berhenti beraktivitas untuk memulihkan tenaga. Tidur adalah bentuk istirahat paling penting bagi anak usia sekolah dasar.\n\nManfaat\nMemulihkan otot setelah beraktivitas, menjaga daya tahan tubuh, membantu pertumbuhan, serta meningkatkan konsentrasi belajar.\n\nHal yang perlu diperhatikan\nAnak usia SD memerlukan tidur sekitar 9 sampai 11 jam setiap malam. Batasi bermain gawai menjelang tidur karena membuat mata sulit mengantuk.",
  t:["Menjelaskan manfaat istirahat dan tidur cukup.","Menyebutkan kebiasaan yang mengganggu tidur.","Menyusun jadwal harian yang seimbang."],
  l:["Kenali tanda tubuh yang kurang istirahat: mengantuk, lesu, dan sulit berkonsentrasi.","Tidur malam sekitar 9 sampai 11 jam bagi anak SD.","Hentikan bermain gawai satu jam sebelum tidur.","Bersihkan diri dan sikat gigi sebelum tidur.","Susun jadwal harian berisi belajar, bermain, olahraga, dan istirahat."],
  p:[{n:"Jadwal Harianku",d:"Siswa menyusun jadwal sehari di kertas lalu menandai waktu istirahat dan olahraganya."},
     {n:"Tebak Kebiasaan",d:"Guru menyebut kebiasaan malam hari, siswa menentukan membantu atau mengganggu tidur."}],
  k:[{s:"Anak usia SD memerlukan tidur sekitar...",o:["9 sampai 11 jam","3 jam","15 jam"],a:0,x:"Tidur 9 sampai 11 jam mendukung pertumbuhan dan konsentrasi anak."},
     {s:"Kebiasaan yang mengganggu tidur adalah...",o:["Bermain gawai sampai larut","Sikat gigi","Membaca buku sebentar"],a:0,x:"Cahaya gawai membuat tubuh sulit mengantuk."},
     {s:"Tubuh yang kurang istirahat akan...",o:["Sulit berkonsentrasi","Lebih kuat","Lebih cepat berlari"],a:0,x:"Kurang istirahat menurunkan konsentrasi dan daya tahan tubuh."}],
  g:{alat:["Kertas dan alat tulis","Kartu kebiasaan","Poster jam tidur anak"],
     pe:"Berbaris, berdoa, tanya jawab jam tidur siswa semalam (10 menit).",
     in:"Penjelasan manfaat istirahat, permainan Tebak Kebiasaan, menyusun Jadwal Harianku dan presentasi singkat (55 menit).",
     pu:"Menyimpulkan kebiasaan tidur sehat, menempel jadwal di kelas, doa (10 menit).",
     r:["Pemahaman manfaat istirahat","Ketepatan menyusun jadwal","Kejujuran menilai kebiasaan sendiri"]}}

 {j:"Kebugaran: Daya Tahan dan Kelincahan",e:"Kebugaran jasmani",a:"kuat",ak:"Jaga tempo lari tetap stabil, dan ubah arah dengan cepat tanpa kehilangan keseimbangan.",

 {j:"Permainan Tradisional: Bentengan",e:"Permainan tradisional",a:"lari",sem:1,ak:"Pemain yang paling akhir menyentuh benteng punya keunggulan mengejar lawan yang keluar lebih dulu.",
  ml:"Pengertian\nBentengan adalah permainan tradisional beregu. Setiap regu memiliki benteng berupa tiang atau pohon, dan berusaha menyentuh benteng lawan tanpa tertangkap.\n\nManfaat\nMelatih kecepatan, kelincahan, strategi regu, komunikasi, serta melestarikan permainan tradisional.\n\nHal yang perlu diperhatikan\nTentukan batas lapangan yang jelas dan pastikan tiang benteng aman disentuh. Sentuhan dilakukan dengan telapak tangan, bukan tarikan atau dorongan.",
  t:["Menerapkan kombinasi lari dan menghindar dalam permainan beregu.","Menyusun strategi bertahan dan menyerang bersama regu.","Menaati aturan permainan dengan sportif."],
  l:["Bagi kelas menjadi dua regu, tiap regu memiliki satu benteng.","Pemain yang menyentuh benteng paling akhir berhak mengejar lawan yang keluar lebih dulu.","Pemain yang tertangkap menjadi tawanan di dekat benteng lawan.","Tawanan dapat dibebaskan bila disentuh teman seregu.","Regu menang bila berhasil menyentuh benteng lawan."],
  p:[{n:"Bentengan Mini",d:"Dimainkan 5 lawan 5 di lapangan kecil agar permainan cepat dan semua ikut aktif."},
     {n:"Kejar Bebas Tawanan",d:"Latihan khusus membebaskan tawanan sambil menghindari kejaran lawan."}],
  k:[{s:"Pemain yang berhak mengejar adalah yang menyentuh benteng...",o:["Paling akhir","Paling awal","Dua kali"],a:0,x:"Aturan bentengan memberi keunggulan pada pemain yang paling baru menyentuh benteng."},
     {s:"Pemain yang tertangkap menjadi...",o:["Tawanan","Wasit","Penonton"],a:0,x:"Tawanan menunggu di dekat benteng lawan sampai dibebaskan teman seregu."},
     {s:"Regu menang bila berhasil...",o:["Menyentuh benteng lawan","Berlari paling jauh","Berteriak paling keras"],a:0,x:"Tujuan permainan adalah menyentuh benteng lawan."}],
  g:{alat:["Dua tiang atau kerucut besar sebagai benteng","Rompi pembeda","Peluit","Kapur pembatas lapangan"],
     pe:"Berbaris, berdoa, pemanasan lari dan gerakan mengubah arah (10 menit).",
     in:"Penjelasan aturan, latihan mengejar dan membebaskan tawanan, dilanjutkan Bentengan Mini beberapa babak (55 menit).",
     pu:"Pendinginan, evaluasi strategi regu, doa (10 menit).",
     r:["Kecepatan dan kelincahan","Kerja sama menyusun strategi","Sportivitas menaati aturan"]}},

 {j:"Gerak Berirama: Senam Ritmik Tanpa Alat",e:"Aktivitas gerak berirama",a:"ritmik",sem:2,ak:"Langkah kaki dan ayunan lengan bergerak bersamaan mengikuti hitungan 1 sampai 8.",
  ml:"Pengertian\nSenam ritmik tanpa alat adalah rangkaian gerak langkah dan ayunan lengan yang dilakukan mengikuti irama musik atau hitungan, tanpa memakai simpai maupun pita.\n\nManfaat\nMeningkatkan kebugaran, koordinasi, kepekaan irama, serta kekompakan dan kepercayaan diri saat tampil berkelompok.\n\nHal yang perlu diperhatikan\nGerakan diajarkan bertahap per 8 hitungan dengan tempo lambat lebih dulu. Jarak antarsiswa diperlebar agar ayunan lengan tidak mengenai teman.",
  t:["Mempraktikkan langkah dasar senam ritmik.","Menggabungkan langkah dengan ayunan lengan sesuai irama.","Menampilkan rangkaian gerak bersama kelompok."],
  l:["Langkah biasa di tempat 1x8 hitungan sambil mengayun lengan ke depan.","Langkah ke samping kanan dan kiri 1x8 hitungan.","Langkah maju mundur dengan ayunan lengan ke atas 1x8 hitungan.","Tambahkan gerakan kepala dan bahu mengikuti irama.","Gabungkan seluruhnya menjadi rangkaian 4x8 hitungan."],
  p:[{n:"Ikuti Pemimpin",d:"Satu siswa memimpin rangkaian, kelompok menirukan sampai musik berganti."},
     {n:"Cermin Berpasangan",d:"Berpasangan saling berhadapan, satu memperagakan gerak dan satu menirukan seperti cermin."}],
  k:[{s:"Rangkaian senam ritmik disusun per...",o:["8 hitungan","5 hitungan","12 hitungan"],a:0,x:"Pola 1–8 memudahkan siswa menghafal dan menyamakan gerak."},
     {s:"Ayunan lengan dan langkah kaki sebaiknya...",o:["Bergerak bersamaan","Bergantian tanpa aturan","Tidak dihitung"],a:0,x:"Keserasian lengan dan kaki membuat gerakan terlihat luwes."},
     {s:"Tempo latihan sebaiknya dimulai dari...",o:["Lambat lalu dipercepat","Langsung cepat","Sangat cepat sejak awal"],a:0,x:"Tempo lambat membantu siswa menguasai gerakan lebih dulu."}],
  g:{alat:["Pemutar musik","Peluit","Aula atau lapangan"],
     pe:"Berbaris berbanjar dengan jarak lebar, berdoa, pemanasan mengikuti musik (10 menit).",
     in:"Guru mengajarkan langkah dasar per 8 hitungan, siswa berlatih kelompok menyusun 4x8, lalu tampil bergantian (55 menit).",
     pu:"Pendinginan mengikuti musik lambat, apresiasi penampilan, doa (10 menit).",
     r:["Keserasian gerak dengan irama","Kekompakan kelompok","Kepercayaan diri saat tampil"]}}
],

5:[

 {j:"Bola Voli: Passing Bawah",e:"Permainan bola besar",a:"passing",ak:"Lengan dirapatkan lurus, lutut ditekuk, dorongan bola berasal dari luruskan lutut bukan ayunan lengan.",

 {j:"Senam Lantai: Rangkaian Guling dan Kayang",e:"Aktivitas senam",a:"guling",ak:"Rangkaian dilakukan mengalir: guling depan, berdiri, lalu kayang dengan tumpuan dua tangan dan dua kaki.",

     {s:"Sebelum melakukan kayang, bagian tubuh yang wajib dipanaskan adalah...",o:["Punggung dan bahu","Jari tangan saja","Leher saja"],a:0,x:"Punggung dan bahu bekerja paling berat sehingga wajib dipanaskan."},

 {j:"Gerak Berirama: Senam Kreasi Kelompok",e:"Aktivitas gerak berirama",a:"ritmik",ak:"Setiap kelompok menyusun 4x8 hitungan, gerakan harus seragam dan sesuai tempo musik.",

 {j:"Pola Hidup Sehat: Gizi Seimbang",e:"Pola hidup sehat",a:"sehat",ak:"Isi piringku: separuh sayur dan buah, separuh lagi makanan pokok dan lauk pauk.",

 {j:"Sepak Bola: Menggiring dan Menembak ke Gawang",e:"Permainan bola besar",a:"tendang",sem:1,ak:"Giring bola dekat dengan kaki, lalu tendang dengan punggung kaki saat menembak ke gawang.",
  ml:"Pengertian\nMenggiring adalah mendorong bola berulang sambil bergerak, sedangkan menembak adalah menendang bola ke arah gawang dengan tenaga terarah menggunakan punggung kaki.\n\nManfaat\nMelatih penguasaan bola, kecepatan, ketepatan arah tendangan, serta pengambilan keputusan kapan menggiring dan kapan menembak.\n\nHal yang perlu diperhatikan\nSaat menembak, kaki tumpu diletakkan di samping bola dan pandangan diarahkan ke sasaran sebelum kaki mengayun. Gunakan bola ukuran 4 agar sesuai untuk siswa SD.",
  t:["Mempraktikkan menggiring bola dengan kontrol dekat.","Mempraktikkan tembakan ke gawang dengan punggung kaki.","Menerapkan kerja sama dalam permainan kelompok kecil."],
  l:["Giring bola dengan sentuhan pelan memakai kaki bagian dalam dan luar.","Giring melewati lima kerucut secara berkelok.","Menjelang gawang, letakkan kaki tumpu di samping bola.","Tendang bola dengan punggung kaki, pandangan ke sasaran.","Ikuti arah bola setelah menembak untuk bersiap menyambut bola pantul."],
  p:[{n:"Giring dan Tembak",d:"Siswa menggiring melewati kerucut lalu menembak ke gawang dari jarak 6 meter, dicatat berapa yang masuk."},
     {n:"Sepak Bola Mini 5 Lawan 5",d:"Permainan setengah lapangan, gol sah bila didahului minimal dua operan."}],
  k:[{s:"Menembak ke gawang dengan tenaga besar sebaiknya memakai...",o:["Punggung kaki","Tumit","Ujung jari"],a:0,x:"Punggung kaki menghasilkan tendangan paling kuat dan terarah."},
     {s:"Saat menggiring, jarak bola dengan kaki sebaiknya...",o:["Dekat","Sangat jauh","Tidak diperhatikan"],a:0,x:"Bola yang dekat lebih mudah dijaga dari rebutan lawan."},
     {s:"Kaki tumpu saat menembak diletakkan...",o:["Di samping bola","Jauh di belakang","Di atas bola"],a:0,x:"Kaki tumpu di samping bola menjaga keseimbangan dan arah tendangan."}],
  g:{alat:["Bola sepak ukuran 4","Kerucut","Gawang kecil atau kerucut sebagai gawang","Rompi pembeda","Peluit"],
     pe:"Berbaris, berdoa, pemanasan lari zig-zag dan peregangan tungkai (10 menit).",
     in:"Latihan menggiring melewati kerucut, latihan menembak dari jarak 6 meter, Giring dan Tembak, lalu Sepak Bola Mini (55 menit).",
     pu:"Pendinginan, evaluasi ketepatan tembakan dan kerja sama, doa (10 menit).",
     r:["Kontrol saat menggiring","Ketepatan tembakan ke gawang","Kerja sama dan sportivitas"]}},

 {j:"Kebugaran: Kekuatan Otot Inti dan Kelenturan",e:"Kebugaran jasmani",a:"kuat",sem:2,ak:"Punggung dijaga lurus saat plank, dan peregangan ditahan tanpa gerakan menghentak.",
  ml:"Pengertian\nOtot inti adalah otot perut, punggung bawah, dan panggul yang menjaga postur tubuh. Kelenturan adalah kemampuan sendi bergerak pada rentang yang luas.\n\nManfaat\nMenjaga postur tubuh, mengurangi risiko cedera punggung, serta menunjang hampir semua gerakan olahraga.\n\nHal yang perlu diperhatikan\nPlank dilakukan dengan punggung lurus, bukan melengkung. Durasi disesuaikan kemampuan, dimulai 10 detik lalu ditambah bertahap. Peregangan ditahan 8 hitungan tanpa menghentak.",
  t:["Mempraktikkan latihan kekuatan otot inti.","Mempraktikkan latihan kelenturan tubuh.","Menyusun program latihan mandiri sederhana di rumah."],
  l:["Plank dengan tumpuan siku dan ujung kaki, punggung lurus, tahan 10 detik.","Sit up 15 kali dengan kaki dipegang teman.","Back up 10 kali dengan mengangkat dada perlahan.","Duduk selonjor lalu raih ujung kaki, tahan 8 hitungan.","Putar pinggang perlahan ke kanan dan kiri masing-masing 8 hitungan."],
  p:[{n:"Sirkuit Empat Pos",d:"Empat pos berisi plank, sit up, back up, dan peregangan, masing-masing 30 detik dengan istirahat 15 detik."},
     {n:"Tantangan Plank Kelompok",d:"Kelompok menahan plank bersama, waktu dicatat dan dibandingkan dengan pekan sebelumnya."}],
  k:[{s:"Otot inti meliputi otot...",o:["Perut dan punggung bawah","Betis","Jari tangan"],a:0,x:"Otot inti menjaga postur dan kestabilan batang tubuh."},
     {s:"Posisi punggung saat plank harus...",o:["Lurus","Melengkung ke bawah","Terangkat tinggi"],a:0,x:"Punggung lurus mencegah nyeri pinggang saat plank."},
     {s:"Peregangan sebaiknya ditahan...",o:["Beberapa hitungan tanpa menghentak","Sambil menghentak cepat","Sekejap saja"],a:0,x:"Menahan peregangan tanpa hentakan membuat otot memanjang dengan aman."}],
  g:{alat:["Matras","Stopwatch","Kartu program latihan","Peluit"],
     pe:"Berbaris, berdoa, pemanasan jogging ringan dan peregangan dinamis (10 menit).",
     in:"Penjelasan tiap pos, pelaksanaan Sirkuit Empat Pos dua putaran, Tantangan Plank Kelompok (55 menit).",
     pu:"Pendinginan, mencatat hasil pada kartu, menyusun program latihan rumah, doa (10 menit).",
     r:["Kebenaran sikap latihan","Ketahanan mengikuti sirkuit","Kedisiplinan mencatat hasil"]}}
],

 {j:"Senam Lantai: Guling Depan dan Guling Belakang",e:"Aktivitas senam",a:"guling-mundur",ak:"Pada guling belakang, telapak tangan di samping telinga siap mendorong matras saat punggung menyentuh.",

     {s:"Sikap akhir kedua gerakan guling adalah...",o:["Jongkok","Telentang","Berdiri satu kaki"],a:0,x:"Guling depan maupun belakang diakhiri sikap jongkok."}],

 {j:"Kebugaran Jasmani dan Pola Hidup Sehat",e:"Kebugaran jasmani",a:"kuat",ak:"Setiap pos tes dilakukan dengan gerak penuh dan tempo tetap agar hasil pengukuran sahih.",

 {j:"Bola Voli: Passing Atas dan Servis Bawah",e:"Permainan bola besar",a:"passing",ak:"Jari membentuk mangkuk di atas dahi, dorongan berasal dari luruskan lutut dan siku bersamaan.",

     {s:"Posisi tangan saat passing atas berada...",o:["Di atas dahi","Di depan perut","Di samping badan"],a:0,x:"Tangan di atas dahi membentuk mangkuk untuk menerima bola."},
     {s:"Servis bawah dipukul dengan...",o:["Telapak tangan dari bawah","Kepala","Lutut"],a:0,x:"Servis bawah dilakukan dengan ayunan tangan dari bawah."}],

 {j:"Atletik: Lompat Tinggi Gaya Gunting",e:"Aktivitas atletik",a:"lompat",ak:"Awalan menyamping, tolakan kaki terjauh dari mistar, kedua kaki diayun bergantian seperti gunting.",

     {s:"Gaya gunting dinamai demikian karena...",o:["Kedua kaki diayun bergantian seperti gunting","Badan berputar","Kaki dirapatkan"],a:0,x:"Gerakan kedua kaki yang menyusul bergantian menyerupai gunting."},
     {s:"Pendaratan lompat tinggi harus dilakukan di atas...",o:["Matras atau bak pasir","Lantai keras","Rumput berbatu"],a:0,x:"Alas empuk mencegah cedera saat mendarat dari ketinggian."}],

     pe:"Berbaris, berdoa, pemanasan lari dan peregangan tungkai serta pinggul (10 menit).",

 {j:"Pola Hidup Sehat: Menjaga Diri dari Kebiasaan Berbahaya",e:"Pola hidup sehat",a:"sehat",ak:"Tubuh yang sehat dijaga dengan olahraga teratur, istirahat cukup, dan menolak kebiasaan yang merusak.",

  l:["Kenali organ tubuh yang terpengaruh rokok: paru-paru dan jantung.","Pahami bahwa asap rokok juga membahayakan orang di sekitar.","Latih kalimat menolak yang sopan namun tegas, misalnya tidak, terima kasih.","Cari kegiatan pengganti yang menyehatkan seperti olahraga dan hobi.","Susun jadwal harian berisi olahraga, belajar, dan istirahat cukup."],

  k:[{s:"Organ tubuh yang paling terpengaruh asap rokok adalah...",o:["Paru-paru","Tulang jari","Kuku"],a:0,x:"Asap rokok merusak saluran napas dan paru-paru."},
     {s:"Orang yang menghirup asap rokok orang lain disebut...",o:["Perokok pasif","Perokok aktif","Bukan perokok"],a:0,x:"Perokok pasif ikut menanggung risiko meski tidak merokok."},
     {s:"Cara menolak ajakan yang tidak sehat sebaiknya...",o:["Sopan tetapi tegas","Dengan marah","Diam saja lalu ikut"],a:0,x:"Penolakan yang sopan tetapi tegas menjaga diri sekaligus hubungan pertemanan."}],
  g:{alat:["Poster atau gambar organ pernapasan","Kertas manila dan spidol","Kartu peran","Lembar jadwal harian"],
     pe:"Berbaris, berdoa, tanya jawab kebiasaan sehat yang sudah dilakukan siswa (10 menit).",

     pu:"Menyusun jadwal kebiasaan sehat harian, memasang poster, doa (10 menit).",
     r:["Pemahaman dampak kebiasaan berbahaya","Keterampilan menolak dengan sopan","Keaktifan menyusun kebiasaan sehat"]}},
 {j:"Sepak Bola: Bermain dengan Peraturan Sederhana",e:"Permainan bola besar",a:"tendang",sem:1,ak:"Terapkan operan, penguasaan posisi, dan aturan dasar seperti lemparan ke dalam serta tendangan sudut.",
  ml:"Pengertian\nBermain sepak bola dengan peraturan sederhana berarti menerapkan seluruh teknik dasar dalam permainan utuh, dilengkapi aturan pokok seperti lemparan ke dalam, tendangan gawang, dan tendangan sudut.\n\nManfaat\nMelatih penerapan teknik dalam situasi nyata, kerja sama tim, disiplin terhadap aturan, serta pengendalian emosi saat bertanding.\n\nHal yang perlu diperhatikan\nGunakan lapangan dan jumlah pemain yang disesuaikan. Tekankan bermain tanpa menjegal dari belakang, dan tunjuk siswa bergantian menjadi wasit agar memahami aturan.",
  t:["Menerapkan teknik dasar sepak bola dalam permainan.","Menaati peraturan dasar permainan sepak bola.","Menunjukkan kerja sama dan pengendalian diri saat bertanding."],
  l:["Bagi regu 7 lawan 7 di lapangan yang diperkecil.","Mulai permainan dengan tendangan kick off dari tengah lapangan.","Bola keluar lewat garis samping dilanjutkan lemparan ke dalam dengan dua tangan di atas kepala.","Bola keluar lewat garis gawang dilanjutkan tendangan gawang atau tendangan sudut.","Setelah gol, permainan dimulai lagi dari tengah lapangan."],
  p:[{n:"Turnamen Kelas",d:"Kelas dibagi empat regu, bermain sistem setengah kompetisi dengan waktu 8 menit per pertandingan."},
     {n:"Wasit Bergilir",d:"Dua siswa bergantian menjadi wasit dan pencatat skor pada setiap pertandingan."}],
  k:[{s:"Bola yang keluar lewat garis samping dilanjutkan dengan...",o:["Lemparan ke dalam","Tendangan sudut","Tendangan penalti"],a:0,x:"Lemparan ke dalam dilakukan dengan dua tangan dari atas kepala."},
     {s:"Permainan dimulai kembali setelah terjadi gol dari...",o:["Tengah lapangan","Sudut lapangan","Depan gawang"],a:0,x:"Setelah gol, permainan dimulai lagi lewat kick off di tengah lapangan."},
     {s:"Sikap yang benar saat keputusan wasit tidak sesuai harapan adalah...",o:["Menerima dengan sportif","Memprotes dengan marah","Meninggalkan lapangan"],a:0,x:"Menerima keputusan wasit adalah bagian penting dari sportivitas."}],
  g:{alat:["Bola sepak ukuran 4","Gawang kecil atau kerucut","Rompi pembeda","Peluit","Papan skor sederhana"],
     pe:"Berbaris, berdoa, pemanasan lari dan permainan operan segitiga (10 menit).",
     in:"Penjelasan aturan dasar, pemanasan taktik posisi, dilanjutkan Turnamen Kelas dengan Wasit Bergilir (55 menit).",
     pu:"Pendinginan, evaluasi penerapan aturan dan sikap sportif, doa (10 menit).",
     r:["Penerapan teknik dalam permainan","Pemahaman peraturan","Sportivitas dan pengendalian diri"]}},

 {j:"Gerak Berirama: Senam Kesegaran Jasmani",e:"Aktivitas gerak berirama",a:"ritmik",sem:2,ak:"Setiap rangkaian dilakukan berurutan: pemanasan, gerakan inti, lalu pendinginan mengikuti irama.",
  ml:"Pengertian\nSenam kesegaran jasmani adalah rangkaian senam massal yang tersusun atas gerakan pemanasan, gerakan inti, dan pendinginan, dilakukan bersama mengikuti irama musik.\n\nManfaat\nMeningkatkan kebugaran menyeluruh, melatih kekompakan, disiplin, serta menjadi kegiatan rutin sekolah yang mudah dilakukan bersama.\n\nHal yang perlu diperhatikan\nBarisan diatur berjarak agar gerakan leluasa. Gerakan dipelajari bertahap per rangkaian, dan siswa yang sedang tidak sehat diberi kegiatan alternatif yang lebih ringan.",

let CARA_SIMPAN = "memori";

/* Isi bawaan yang ikut menempel di dalam file saat guru menekan
   "Unduh aplikasi siap dibagikan". Jangan diubah manual. */
let BAWAAN = null; /*ISI-BAWAAN*/

function bukaDB(){
  return new Promise((ok,gagal)=>{
    if(!window.indexedDB) return gagal();
    const r = indexedDB.open("ayogerak",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("data");
    r.onsuccess = ()=> ok(r.result);
    r.onerror = ()=> gagal(r.error);
  });
}
function bungkusData(){ return {gambar:S.gambar, video:S.video, sunting:S.sunting, regu:S.regunama, preset:S.preset, akun:S.akun, server:S.server, antrian:S.antrian, perangkat:S.perangkat, pilihanNilai:S.pilihanNilai,
           namaApp:S.namaApp, subApp:S.subApp, kodeKelas:S.kodeKelas, kodeGuru:S.kodeGuru, logo:S.logo, tambahan:S.tambahan}; }
function bukaData(d){
  if(!d) return;
  if(d.gambar) S.gambar = {...S.gambar, ...d.gambar};
  if(d.video) S.video = {...S.video, ...d.video};
  if(d.sunting) S.sunting = {...S.sunting, ...d.sunting};
  if(d.regu) S.regunama = d.regu;
  if(d.preset) S.preset = d.preset;
  if(d.akun) S.akun = d.akun;
  if(d.server) S.server = d.server;
  if(d.antrian) S.antrian = d.antrian;
  if(d.perangkat) S.perangkat = d.perangkat;
  if(d.pilihanNilai) S.pilihanNilai = d.pilihanNilai;
  if(d.namaApp) S.namaApp = d.namaApp;
  if(d.logo) S.logo = d.logo;
  if(d.tambahan) S.tambahan = {...S.tambahan, ...d.tambahan};
  if(d.subApp) S.subApp = d.subApp;
  if(d.kodeKelas && !S.kodeUndangan) S.kodeKelas = d.kodeKelas;
  if(d.kodeGuru && !S.kodeUndangan) S.kodeGuru = d.kodeGuru;
}
async function simpanData(){
  const isi = bungkusData();
  try{
    const db = await bukaDB();
    await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readwrite");
      t.objectStore("data").put(isi,"aplikasi");
      t.oncomplete = ok; t.onerror = ()=>gagal(t.error);
    });
    CARA_SIMPAN = "perangkat"; return true;
  }catch(e){
    try{ localStorage.setItem("ayogerak.data", JSON.stringify(isi)); CARA_SIMPAN="perangkat"; return true; }
    catch(e2){ CARA_SIMPAN="memori"; return false; }
  }
}
async function muatData(){
  if(BAWAAN) bukaData(BAWAAN);
  try{
    const db = await bukaDB();
    const data = await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readonly");
      const q = t.objectStore("data").get("aplikasi");
      q.onsuccess = ()=> ok(q.result); q.onerror = ()=> gagal(q.error);
    });
    bukaData(data); CARA_SIMPAN = "perangkat"; return;
  }catch(e){}
  try{
    const teks = localStorage.getItem("ayogerak.data");
    if(teks) bukaData(JSON.parse(teks));
    CARA_SIMPAN = "perangkat";
  }catch(e2){ CARA_SIMPAN = "memori"; }
}
function jadikanKotak(berkas, ukuran){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const c = document.createElement("canvas");
        c.width = c.height = ukuran;
        const ctx = c.getContext("2d");
        const skala = Math.min(ukuran/img.width, ukuran/img.height);
        const w = img.width*skala, h = img.height*skala;
        ctx.drawImage(img, (ukuran-w)/2, (ukuran-h)/2, w, h);
        try{ ok(c.toDataURL("image/png")); }catch(e){ ok(null); }
      };
      img.onerror = ()=> ok(null);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}
function kecilkan(berkas){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maks = 1200; let w = img.width, h = img.height;
        if(w>maks){ h = Math.round(h*maks/w); w = maks; }
        if(h>maks){ w = Math.round(w*maks/h); h = maks; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ ok(c.toDataURL("image/jpeg",0.78)); }catch(e){ ok(r.result); }
      };
      img.onerror = ()=> ok(r.result);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}

"1-5":"Pengertian\nKebersihan tubuh adalah upaya menjaga badan tetap bersih agar terhindar dari kuman penyebab penyakit. Bagian yang paling mudah kotor pada anak adalah tangan, kuku, wajah, dan kaki.\n\nManfaat\nMengurangi risiko penyakit seperti diare, cacingan, dan flu, serta membentuk kebiasaan baik sejak dini.\n\nHal yang perlu diperhatikan\nMencuci tangan dengan sabun dan air mengalir selama kurang lebih 20 detik jauh lebih efektif daripada sekadar membasahi tangan. Kebiasaan ini perlu dipantau berkelanjutan, bukan diajarkan sekali lalu ditinggalkan.",
"2-3":"Pengertian\nMenendang dan menggiring bola termasuk gerak manipulatif, yaitu gerak yang melibatkan penguasaan benda dengan kaki. Menggiring berarti mendorong bola berulang sambil berjalan atau berlari.\n\nManfaat\nMelatih koordinasi kaki dan mata, keseimbangan saat bergerak, serta dasar keterampilan permainan sepak bola.\n\nHal yang perlu diperhatikan\nGunakan bola plastik ringan agar siswa tidak takut dan kaki tidak sakit. Sentuhan saat menggiring harus pelan dan sering supaya bola tidak jauh dari kaki.",
"2-4":"Pengertian\nBerlari dan berbelok adalah kombinasi gerak lokomotor yang menuntut kelincahan, yaitu kemampuan mengubah arah tubuh dengan cepat tanpa kehilangan keseimbangan.\n\nManfaat\nMelatih kelincahan, keseimbangan dinamis, dan kesadaran ruang, yang berguna hampir pada semua permainan.\n\nHal yang perlu diperhatikan\nLangkah diperpendek menjelang belokan dan badan dicondongkan ke arah belokan. Pastikan lapangan bebas batu dan siswa menjaga jarak agar tidak bertabrakan.",
"2-5":"Pengertian\nMakanan sehat adalah makanan yang bersih, bergizi, dan aman dikonsumsi. Jajanan aman adalah jajanan yang tertutup, tidak berwarna mencolok, dan dijual di tempat bersih.\n\nManfaat\nMenjaga daya tahan tubuh, mendukung pertumbuhan, serta membantu konsentrasi belajar di sekolah.\n\nHal yang perlu diperhatikan\nBiasakan sarapan sebelum berangkat sekolah dan mencuci tangan sebelum makan. Hindari jajanan terbuka di pinggir jalan yang terpapar debu dan asap kendaraan.",
"3-3":"Pengertian\nPermainan bola besar dengan lemparan dan tangkapan melatih gerak manipulatif dalam bentuk operan dada dan operan pantul, yang menjadi dasar bola tangan dan bola basket.\n\nManfaat\nMelatih koordinasi mata dan tangan, ketepatan operan, komunikasi antarpemain, serta kerja sama regu.\n\nHal yang perlu diperhatikan\nOperan diarahkan setinggi dada penerima, bukan ke wajah. Gunakan bola berukuran sedang yang tidak terlalu keras agar siswa berani menangkap.",
"3-4":"Pengertian\nLari zig-zag dan lompat rintangan menggabungkan unsur kecepatan, kelincahan, dan daya ledak tungkai dalam satu rangkaian gerak atletik sederhana.\n\nManfaat\nMeningkatkan kelincahan, koordinasi, keberanian, serta kemampuan mengatur langkah menjelang rintangan.\n\nHal yang perlu diperhatikan\nRintangan dibuat rendah dan dari bahan yang aman seperti kardus atau tali karet, bukan benda keras. Pendaratan selalu dengan dua kaki dan lutut mengeper.",
"3-5":"Pengertian\nGerak berirama dengan alat adalah senam irama yang memakai simpai, pita, atau gada. Alat menjadi perpanjangan gerak lengan sehingga rangkaian terlihat lebih indah.\n\nManfaat\nMelatih koordinasi mata, tangan, dan alat, kepekaan irama, kreativitas, serta kekompakan kelompok.\n\nHal yang perlu diperhatikan\nAlat bisa dibuat sendiri dari tali atau kain bekas bila sekolah belum punya. Jarak antarsiswa diperlebar karena alat menambah jangkauan gerak.",
"4-3":"Pengertian\nBulu tangkis adalah permainan bola kecil menggunakan raket dan kok. Servis pendek adalah pukulan pembuka yang diarahkan jatuh dekat garis servis lawan.\n\nManfaat\nMelatih koordinasi mata dan tangan, kelincahan kaki, ketepatan, serta konsentrasi.\n\nHal yang perlu diperhatikan\nPegangan raket seperti berjabat tangan dan tidak digenggam terlalu kuat agar pergelangan tetap luwes. Atur jarak antarsiswa saat latihan agar raket tidak mengenai teman.",
"4-4":"Pengertian\nGuling belakang adalah gerakan berguling ke arah belakang dengan badan membulat. Sikap lilin adalah sikap tidur telentang dengan kedua kaki lurus ke atas bertumpu pada tengkuk dan bahu.\n\nManfaat\nMelatih kelenturan tulang belakang, kekuatan lengan dan otot perut, keseimbangan, serta keberanian.\n\nHal yang perlu diperhatikan\nTelapak tangan diletakkan di samping telinga untuk mendorong matras, dan dagu tetap rapat ke dada. Latihan wajib memakai matras dan didampingi guru. Siswa dengan keluhan leher atau punggung diberi kegiatan alternatif.",
"4-5":"Pengertian\nDaya tahan adalah kemampuan tubuh bekerja dalam waktu lama tanpa kelelahan berlebihan, sedangkan kelincahan adalah kemampuan mengubah arah tubuh dengan cepat.\n\nManfaat\nMeningkatkan kerja jantung dan paru, membuat tubuh tidak mudah lelah, serta menunjang hampir semua cabang permainan.\n\nHal yang perlu diperhatikan\nLatihan disesuaikan kemampuan, bukan dipaksakan. Ajarkan pengaturan napas yang teratur, dan hasil pengukuran dipakai untuk perbaikan diri, bukan untuk membanding-bandingkan siswa.",
"5-3":"Pengertian\nRangkaian senam lantai adalah gabungan beberapa gerakan yang dilakukan berurutan tanpa jeda panjang. Kayang adalah sikap melengkungkan badan bertumpu pada kedua tangan dan kedua kaki.\n\nManfaat\nMelatih kelenturan tulang belakang, kekuatan lengan dan bahu, keseimbangan, serta kemampuan merangkai gerak menjadi penampilan utuh.\n\nHal yang perlu diperhatikan\nPemanasan punggung dan bahu wajib dilakukan sebelum kayang. Latihan dimulai dari posisi berbaring dengan bantuan teman atau guru, tidak langsung dari sikap berdiri.",
"5-4":"Pengertian\nSenam kreasi adalah rangkaian gerak berirama yang disusun sendiri oleh kelompok, biasanya terdiri atas gerakan pemanasan, inti, dan penutup mengikuti satu lagu.\n\nManfaat\nMelatih kreativitas, kerja sama, kepekaan irama, kebugaran, serta kepercayaan diri tampil di depan orang lain.\n\nHal yang perlu diperhatikan\nRangkaian disusun per 8 hitungan agar mudah dihafal. Beri kesempatan setiap anggota menyumbang ide, dan penilaian menekankan keserasian gerak, bukan kesulitan gerakan.",
"5-5":"Pengertian\nGizi seimbang adalah pola makan yang memenuhi kebutuhan tubuh dengan proporsi tepat, digambarkan lewat panduan Isi Piringku: separuh piring sayur dan buah, separuh lagi makanan pokok dan lauk pauk.\n\nManfaat\nMendukung pertumbuhan, menjaga daya tahan tubuh, serta membantu konsentrasi belajar dan performa saat berolahraga.\n\nHal yang perlu diperhatikan\nAir putih 6 sampai 8 gelas sehari sering terlupakan padahal penting. Batasi makanan tinggi gula, garam, dan minyak. Hindari membanding-bandingkan bentuk tubuh siswa saat membahas topik ini.",
"6-3":"Pengertian\nPassing atas adalah teknik menerima dan mengarahkan bola voli menggunakan ujung jari di atas dahi. Servis bawah adalah pukulan pembuka dengan ayunan tangan dari bawah.\n\nManfaat\nMelatih koordinasi, ketepatan, refleks, serta kerja sama tiga sentuhan dalam permainan bola voli.\n\nHal yang perlu diperhatikan\nJari dibentuk seperti mangkuk dan bola disentuh dengan ujung jari, bukan ditepuk telapak. Gunakan bola voli ringan agar jari siswa tidak cedera.",
"6-4":"Pengertian\nLompat tinggi gaya gunting adalah nomor atletik dengan awalan menyamping, tolakan satu kaki, dan kedua kaki diayun bergantian melewati mistar seperti gerakan gunting.\n\nManfaat\nMelatih daya ledak tungkai, koordinasi awalan dan tolakan, keberanian, serta ketepatan mengatur langkah.\n\nHal yang perlu diperhatikan\nKaki tolak adalah kaki yang terjauh dari mistar. Gunakan tali karet sebagai pengganti mistar agar aman bila tersangkut, dan pendaratan wajib di atas matras atau bak pasir.",
"6-5":"Pengertian\nMenjaga diri dari kebiasaan berbahaya berarti memahami dampak buruk rokok dan zat berbahaya lain bagi tubuh, serta mampu menolak ajakan untuk mencobanya.\n\nManfaat\nMelindungi organ pernapasan dan jantung, menumbuhkan keberanian mengambil keputusan sehat, serta membentuk kebiasaan positif sebagai penggantinya.\n\nHal yang perlu diperhatikan\nSampaikan dengan bahasa yang tenang dan berbasis fakta kesehatan, tanpa menakut-nakuti berlebihan. Tekankan keterampilan menolak dengan sopan dan hadirkan kegiatan pengganti yang menyenangkan seperti olahraga dan hobi."
};

function figur(cls){
  return `<g class="figur ${cls||""}">
    <circle class="kepala" cx="100" cy="52" r="13"/>
    <line class="badan" x1="100" y1="66" x2="100" y2="115"/>
    <g class="lgn lgn-ki"><line x1="100" y1="78" x2="76" y2="104"/></g>
    <g class="lgn lgn-ka"><line x1="100" y1="78" x2="124" y2="104"/></g>
    <g class="kk kk-ki"><line x1="100" y1="115" x2="84" y2="162"/></g>
    <g class="kk kk-ka"><line x1="100" y1="115" x2="116" y2="162"/></g>
  </g>`;
}
function svgGerak(a){
  const tanah = `<line class="tanah" x1="10" y1="166" x2="230" y2="166"/>`;
  let isi = "";
  if(a==="guling"||a==="guling-mundur"){
    isi = `<g class="gulung">
        <circle cx="100" cy="130" r="30"/>
        <circle class="kepala" cx="100" cy="112" r="11"/>
        <line x1="86" y1="146" x2="112" y2="150"/>
      </g>`;
  } else if(a==="estafet"){
    isi = `<g transform="translate(-42,0) scale(.86) translate(16,26)">${figur()}</g>
           <g transform="translate(46,0) scale(.86) translate(16,26)">${figur()}</g>
           <line class="alat tongkat" x1="88" y1="118" x2="112" y2="118"/>`;
  } else {
    isi = figur();
    if(a==="tendang") isi += `<circle class="bola" cx="126" cy="158" r="11"/>`;
    if(a==="lempar")  isi += `<circle class="bola" cx="128" cy="104" r="10"/>`;
    if(a==="passing") isi += `<circle class="bola" cx="100" cy="96" r="12"/>`;
    if(a==="dribel")  isi += `<circle class="bola" cx="134" cy="156" r="12"/>`;
    if(a==="pukul")   isi += `<g class="alat alat-pukul" style="transform-origin:100px 90px"><line x1="100" y1="90" x2="150" y2="70"/></g>
                              <circle class="bola" cx="152" cy="70" r="9"/>`;
    if(a==="sehat")   isi += `<circle class="gelembung g1" cx="86" cy="112" r="7"/>
                              <circle class="gelembung g2" cx="108" cy="116" r="5"/>
                              <circle class="gelembung g3" cx="96" cy="108" r="6"/>`;
  }
  return `<svg class="gerak a-${a}" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animasi peragaan gerak">${tanah}${isi}</svg>`;
}
